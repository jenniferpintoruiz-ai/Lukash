<style>
        .clay-btn {
            box-shadow: 0 8px 0 0 rgba(0,0,0,0.8), inset 0 4px 10px rgba(255,255,255,0.4);
            transition: all 0.1s ease;
        }
        .clay-btn:active {

        }
        .wheel-container {

        }

            transition: transform 4s cubic-bezier(0.1, 0, 0, 1);
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
        }
        .bg-wave-gradient {
            background: linear-gradient(135deg, #F2C500 0%, #F2984A 50%, #EE4599 100%);
        }
        
        /* Drawer Animations */
        #nav-drawer {
            transition: transform 0.3s ease-in-out;
            transform: translateX(-100%);
        }
        #nav-drawer.open {
            transform: translateX(0);
        }
        #drawer-overlay {
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }
        #drawer-overlay.open {
            opacity: 0.5;
            pointer-events: auto;
        }

        /* Chat Animations */
        .chat-window {
            transform-origin: bottom right;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
        }
        
        .hidden-chat {
            opacity: 0;
            transform: scale(0.5) translateY(50px);
            pointer-events: none;
        }
        
        .active-chat {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }
        
        .chat-msg {
            animation: slideIn 0.3s ease forwards;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fab-btn {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .fab-btn:hover {
            transform: scale(1.1);
        }
        
        .fab-btn.exploding {
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #EE4599;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const spinBtn = document.getElementById('spinButton');
            const wheel = document.getElementById('fortuneWheel');
            const starNeedle = document.getElementById('starNeedle');
            let starRotation = 0;

            if(spinBtn) {
                spinBtn.addEventListener('click', () => {
                    if (spinBtn.disabled) return;
                    
                    spinBtn.disabled = true;
                    spinBtn.style.opacity = '0.7';
                    spinBtn.style.transform = 'translateY(8px)';
                    spinBtn.style.boxShadow = '0 0px 0 0 rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.4)';

                    // Random rotation between 1800 (5 spins) and 3600 (10 spins)
                    const extraDegrees = Math.floor(Math.random() * 360);
                    const spins = 1800; // 5 full spins minimum
                    starRotation += (spins + extraDegrees); // Spin the star

                    if(starNeedle) {
                        starNeedle.style.transform = `translateY(-25%) rotate(${starRotation}deg)`;
                    }

                    // Re-enable button after animation (4s)
                    setTimeout(() => {
                        spinBtn.disabled = false;
                        spinBtn.style.opacity = '1';
                        spinBtn.style.transform = '';
                        spinBtn.style.boxShadow = '';
                        // Here you would typically trigger the reward modal
                    }, 4000);
                });
            }

            // Drawer Logic
            const menuToggleBtn = document.getElementById('menu-toggle-btn');
            const closeMenuBtn = document.getElementById('close-menu-btn');
            const navDrawer = document.getElementById('nav-drawer');
            const drawerOverlay = document.getElementById('drawer-overlay');

            function toggleDrawer() {
                navDrawer.classList.toggle('open');
                drawerOverlay.classList.toggle('open');
            }

            if(menuToggleBtn) menuToggleBtn.addEventListener('click', toggleDrawer);
            if(closeMenuBtn) closeMenuBtn.addEventListener('click', toggleDrawer);
            if(drawerOverlay) drawerOverlay.addEventListener('click', toggleDrawer);

            // Chat Functionality
            const fabButton = document.getElementById('fab-button');
            const chatContainer = document.getElementById('chat-container');
            const closeChatBtn = document.getElementById('close-chat');
            const particleContainer = document.getElementById('particle-container');
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const chatMessages = document.getElementById('chat-messages');

            function createParticles(x, y) {
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    
                    // Random angle and distance
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = 50 + Math.random() * 100;
                    const tx = Math.cos(angle) * velocity;
                    const ty = Math.sin(angle) * velocity;
                    
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    particle.style.setProperty('--tx', `${tx}px`);
                    particle.style.setProperty('--ty', `${ty}px`);
                    
                    const duration = 0.5 + Math.random() * 0.3;
                    particle.style.animation = `explode ${duration}s ease-out forwards`;
                    
                    // Random colors
                    const colors = ['#EE4599', '#ffde68', '#78ceff'];
                    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                    
                    particleContainer.appendChild(particle);
                    
                    setTimeout(() => particle.remove(), duration * 1000);
                }
            }

            fabButton.addEventListener('click', (e) => {
                const rect = fabButton.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                createParticles(centerX, centerY);
                
                fabButton.classList.add('exploding');
                
                setTimeout(() => {
                    chatContainer.classList.remove('hidden-chat');
                    chatContainer.classList.add('active-chat');
                }, 100);
            });

            closeChatBtn.addEventListener('click', () => {
                chatContainer.classList.remove('active-chat');
                chatContainer.classList.add('hidden-chat');
                
                setTimeout(() => {
                    fabButton.classList.remove('exploding');
                }, 300);
            });

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const msg = chatInput.value.trim();
                if (!msg) return;

                // Add User Message
                const userMsgHtml = `
                    <div class="flex gap-2 max-w-[85%] self-end chat-msg">
                        <div class="bg-primary p-3 rounded-2xl rounded-br-sm text-sm text-on-primary">
                            ${msg}
                        </div>
                    </div>
                `;
                chatMessages.insertAdjacentHTML('beforeend', userMsgHtml);
                chatInput.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Simulate Bot Response
                setTimeout(() => {
                    const botMsgHtml = `
                        <div class="flex gap-2 max-w-[85%] chat-msg">
                            <div class="w-8 h-8 rounded-full bg-surface-container-high p-1 shrink-0 mt-auto">
                                <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQ_AEtVRAaESaowtYS8dd6KOctLhtfH9BwWgw2JTmlvp2_6C7YyoPBhStTRAeFb9lZcOqvXQHLnMqXQVnZ9vz9c7Kqwu8_tcIdzflKpAAzL5ltuV_HfqtkqDT7tZmefzWoit6nA7-4ss9nOqs4qVsb2lEXksjgPFdWvgGGpYLvDksfiZ4iZD-m9lFIjq6aDLLmCuFZH8DKOjebYstE2Qy3wDfIDkr_-0-dWPqtNB1zk07UDwgljEK9J3pLSHUxzLMs9g" alt="Bot" class="w-full h-full object-contain">
                            </div>
                            <div class="bg-surface-container-high p-3 rounded-2xl rounded-bl-sm text-sm text-on-surface">
                                Interesante... ¡Seguí contándome!
                            </div>
                        </div>
                    `;
                    chatMessages.insertAdjacentHTML('beforeend', botMsgHtml);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 1000);
            });
