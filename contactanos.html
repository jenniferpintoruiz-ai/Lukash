<!-- Coverflow Controller Script -->
<script data-purpose="coverflow-controller">
  (function () {
    const cards = Array.from(document.querySelectorAll('.coverflow-card'));
    const label = document.getElementById('activeSocialLabel');
    const track = document.getElementById('carouselTrack');
    
    const total = cards.length;
    // TikTok is index 2 in our DOM list, Gmail is index 3
    let currentIndex = 3; 
    let startX = 0;
    let currentDeltaX = 0;
    let isDragging = false;
    let maxDeltaMoved = 0;

    function openSocialLink(url) {
      if (!url) return;
      if (url.startsWith('mailto:')) {
        window.location.href = url;
      } else {
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    function getSpacing() {
      const width = window.innerWidth;
      if (width >= 1024) {
        return { step1: 180, step2: 320 };
      } else if (width >= 768) {
        return { step1: 140, step2: 240 };
      } else if (width >= 640) {
        return { step1: 105, step2: 180 };
      } else {
        return { step1: 72, step2: 125 };
      }
    }

    // Update positions based on coverflow perspective
    function renderCoverflow() {
      const spacing = getSpacing();

      cards.forEach((card, i) => {
        let diff = (i - currentIndex) % total;
        if (diff > total / 2) diff -= total;
        if (diff < -total / 2) diff += total;

        let translateX = 0;
        let scale = 1;
        let zIndex = 10;
        let opacity = 1;
        let rotateY = 0;

        if (diff === 0) {
          // Active Center item
          translateX = 0;
          scale = 1.06;
          zIndex = 30;
          rotateY = 0;
          opacity = 1;
        } else if (diff === -1) {
          translateX = -spacing.step1;
          scale = 0.82;
          zIndex = 20;
          rotateY = 16;
          opacity = 0.95;
        } else if (diff === 1) {
          translateX = spacing.step1;
          scale = 0.82;
          zIndex = 20;
          rotateY = -16;
          opacity = 0.95;
        } else if (diff === -2) {
          translateX = -spacing.step2;
          scale = 0.68;
          zIndex = 10;
          rotateY = 28;
          opacity = 0.88;
        } else if (diff === 2) {
          translateX = spacing.step2;
          scale = 0.68;
          zIndex = 10;
          rotateY = -28;
          opacity = 0.88;
        } else {
          translateX = diff > 0 ? (spacing.step2 + 100) : -(spacing.step2 + 100);
          scale = 0.45;
          zIndex = 1;
          opacity = 0;
        }

        card.style.transform = `translateX(${translateX}px) scale(${scale}) rotateY(${rotateY}deg)`;
        card.style.zIndex = zIndex;
        card.style.opacity = opacity;
      });

      // Update active platform text
      const activeCard = cards[currentIndex];
      if (activeCard && label) {
        label.textContent = activeCard.dataset.name;
      }
    }

    // Move by offset (-1 or +1) with looping
    function move(direction) {
      currentIndex = (currentIndex + direction + total) % total;
      renderCoverflow();
    }

    // Event Listeners for click on individual cards
    cards.forEach((card, index) => {
      card.addEventListener('click', (e) => {
        if (maxDeltaMoved > 10) return;
        if (index === currentIndex) {
          openSocialLink(card.dataset.url);
        } else {
          currentIndex = index;
          renderCoverflow();
        }
      });
    });

    // Label click also opens the current active platform's link
    if (label) {
      label.style.cursor = 'pointer';
      label.addEventListener('click', () => {
        const activeCard = cards[currentIndex];
        if (activeCard) {
          openSocialLink(activeCard.dataset.url);
        }
      });
    }

    // Pointer & Touch Events for Drag/Swipe
    function handleStart(clientX) {
      isDragging = true;
      startX = clientX;
      currentDeltaX = 0;
      maxDeltaMoved = 0;
    }

    function handleMove(clientX) {
      if (!isDragging) return;
      currentDeltaX = clientX - startX;
      if (Math.abs(currentDeltaX) > maxDeltaMoved) {
        maxDeltaMoved = Math.abs(currentDeltaX);
      }
    }

    function handleEnd() {
      if (!isDragging) return;
      isDragging = false;
      const threshold = 35;
      if (currentDeltaX > threshold) {
        move(-1);
      } else if (currentDeltaX < -threshold) {
        move(1);
      }
      currentDeltaX = 0;
    }

    // Touch listener setup
    track.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX), { passive: true });
    track.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX), { passive: true });
    track.addEventListener('touchend', handleEnd, { passive: true });

    // Mouse listener setup
    track.addEventListener('mousedown', (e) => handleStart(e.clientX));
    window.addEventListener('mousemove', (e) => {
      if (isDragging) handleMove(e.clientX);
    });
    window.addEventListener('mouseup', () => {
      if (isDragging) handleEnd();
    });

    // Keyboard left/right arrow navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') move(-1);
      if (e.key === 'ArrowRight') move(1);
      if (e.key === 'Enter') {
        const activeCard = cards[currentIndex];
        if (activeCard) openSocialLink(activeCard.dataset.url);
      }
    });

    // Window resize handler to maintain proportional spacing
    window.addEventListener('resize', () => {
      renderCoverflow();
    });

    // Initial render
    renderCoverflow();
  })();
</script>
<script data-purpose="modal-functionality">
  const menuBtn = document.getElementById('menuBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
  const mobileMenuDrawer = document.getElementById('mobileMenuDrawer');
  const closeMenuBtn = document.getElementById('closeMenuBtn');
  const menuIcon = menuBtn ? menuBtn.querySelector('.hamburger-icon') : null;

  function openMenu() {
    mobileMenu.classList.remove('hidden');
    if(menuIcon) menuIcon.classList.add('hidden');
    setTimeout(() => {
      mobileMenuOverlay.classList.remove('opacity-0');
      mobileMenuDrawer.classList.remove('-translate-x-[150%]');
    }, 10);
  }

  function closeMenu() {
    closeMenuBtn.style.opacity = '0';
    mobileMenuOverlay.classList.add('opacity-0');
    mobileMenuDrawer.classList.add('-translate-x-[150%]');
    setTimeout(() => {
      mobileMenu.classList.add('hidden');
      closeMenuBtn.style.opacity = '1';
      if(menuIcon) menuIcon.classList.remove('hidden');
    }, 300);
  }

  if(menuBtn) menuBtn.addEventListener('click', openMenu);
  if(closeMenuBtn) closeMenuBtn.addEventListener('click', closeMenu);
  if(mobileMenuOverlay) mobileMenuOverlay.addEventListener('click', closeMenu);
</script>
<script data-purpose="navegacion-categorias">
  (function () {
    const dCat = document.getElementById('desktopCategorias');
    const dBtn = document.getElementById('desktopCategoriasBtn');
    const dMenu = document.getElementById('desktopCategoriasMenu');
    const dArrow = document.getElementById('desktopCategoriasArrow');
    if (dCat && dBtn && dMenu && dArrow) {
      const toggle = (open) => {
        dMenu.classList.toggle('hidden', !open);
        dArrow.classList.toggle('rotate-180', open);
      };
      dBtn.addEventListener('click', (e) => { e.stopPropagation(); toggle(dMenu.classList.contains('hidden')); });
      dCat.addEventListener('mouseenter', () => toggle(true));
      dCat.addEventListener('mouseleave', () => toggle(false));
      document.addEventListener('click', (e) => { if (!dCat.contains(e.target)) toggle(false); });
    }
    const mBtn = document.getElementById('mobileCategoriasBtn');
    const mMenu = document.getElementById('mobileCategoriasMenu');
    const mArrow = document.getElementById('mobileCategoriasArrow');
    if (mBtn && mMenu && mArrow) {
      mBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isHidden = mMenu.classList.contains('hidden');
        mMenu.classList.toggle('hidden', !isHidden);
        mArrow.classList.toggle('rotate-180', isHidden);
      });
    }
  })();
</script>
<script data-purpose="theme-toggle">
  (function () {
    var key = 'lukash-theme';
    var root = document.documentElement;
    var apply = function (dark) {
      root.classList.toggle('dark', dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    };
    var toggles = document.querySelectorAll('.theme-toggle');
    var stored = null;
    try { stored = localStorage.getItem(key); } catch (e) {}
    var shouldDark = stored ? (stored === 'dark') : root.classList.contains('dark');
    apply(shouldDark);
    toggles.forEach(function (t) {
      t.addEventListener('click', function () { apply(!root.classList.contains('dark')); });
    });
  })();
</script>
