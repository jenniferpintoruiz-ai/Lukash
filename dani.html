<script>
(function() {
    const budgetInput = document.getElementById('monthly-budget-input');
    if (!budgetInput) return;

    function formatValue(val) {
        if (!val) return '';
        return parseInt(val.replace(/\D/g, ''), 10).toLocaleString('es-CO');
    }

    // Load from localStorage using 'presupuestoMensual' key
    const savedBudget = localStorage.getItem('presupuestoMensual');
    if (savedBudget) {
        budgetInput.value = formatValue(savedBudget);
    }

    // Update localStorage on change and keep formatting
    budgetInput.addEventListener('input', (e) => {
        let rawValue = e.target.value.replace(/\D/g, '');
