<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUKA$H - Chat</title>

<!-- ===== Fuentes (Google Fonts) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Roboto:ital,wght@0,400;0,500;0,700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   DESIGN TOKENS (DESIGN.md)
   Base: crema #f7efd0 + azul oscuro #180F43.
   Acentos fucsia / amarillo: SOLO botones clave, logo y detalles.
   ===================================================================== */
:root {
  --color-primary-fuchsia: #EE4599;
  --color-primary-pink: #DE7A8F;
  --color-primary-dark-blue: #180F43;
  --color-primary-yellow: #E7C11F;
  --color-primary-white: #EEE8E0;
  --color-primary-black: #212121;
  --color-secondary-blue: #01504B;
  --color-green-lemon: #91DA26;
  --color-green-mid: #8AC346;
  --color-green-light: #95EC2F;
  --bg-gradient-warm: linear-gradient(90deg, #EE4599 0%, #E7C11F 100%);
  --font-heading: 'Fredoka', 'Bubblegum Sans', sans-serif;
  --font-body: 'Roboto', sans-serif;

  --bg-cream: #f7efd0;
  --bg-surface: #ffffff;
  --radius-lg: 22px;
}

/* ===== Reset base ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: var(--font-body);
  color: var(--color-primary-dark-blue);
  background-color: var(--bg-cream);
  -webkit-font-smoothing: antialiased;
}

.hidden { display: none !important; }

/* ============================================================
   Contenedor del chat (solo modo claro)
   Estado chiquito: widget flotante abajo a la derecha.
   Estado grande:  `.app--full` ocupa la pantalla.
   `transform: translateZ(0)` convierte .app en contenedor de
   los elementos `fixed` internos (chips y barra de entrada).
   ============================================================ */
.app {
  position: fixed;
  right: 14px;
  bottom: 14px;
  width: min(92vw, 372px);
  height: min(72vh, 540px);
  display: flex;
  flex-direction: column;
  background-color: var(--bg-cream);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 10px 28px rgba(24,15,67,.18);
  transform: translateZ(0);
  z-index: 40;
}
.app--full {
  width: 100%;
  max-width: 780px;
  height: auto;
  left: 50%; top: 0; bottom: 0;
  transform: translateX(-50%);
  border-radius: 0;
  margin: 0 auto;
  box-shadow: none;
}
/* Modo "grande" standalone: se abre lukash-chat.html?full=1 como pagina
   completa (desde GUIA PERSONALIZADA / CONSULTAR A LA IA). Ocupa toda
   la pantalla para que el chat se vea grande y centrado. */
.app--standalone {
  width: 100%;
  max-width: 100%;
  height: 100vh;
  max-height: 100vh;
  left: 0;
  top: 0;
  bottom: 0;
  transform: none;
  border-radius: 0;
  margin: 0;
  box-shadow: none;
  border-left: 10px solid var(--color-primary-yellow);
  border-right: 10px solid var(--color-primary-yellow);
  z-index: 50;
}
@media (min-width: 900px) {
  .app--standalone {
    width: min(860px, 100%);
    border-left: none;
    border-right: none;
  }
}
.app--hidden { display: none; }

/* ===== Encabezado (siempre fijo con la imagen del chat) ===== */
.app-header {
  flex: 0 0 auto;
  height: 64px;
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background-color: var(--color-primary-dark-blue);
  color: var(--bg-cream);
  z-index: 20;
}
.header-title { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--color-primary-yellow);
  color: var(--color-primary-dark-blue);
  font-size: 20px;
  overflow: hidden;
}
.header-title h1 {
  font-family: var(--font-heading);
  font-size: clamp(1.15rem, 3vw, 1.45rem);
  letter-spacing: .05em;
}
.header-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  border: none;
  background: transparent;
  color: inherit;
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}
.icon-btn:hover { background: rgba(247,239,208,.15); }
.icon-btn:active { transform: scale(.92); }

/* ===== Panel de mensajes ===== */
.chat-area {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 22px 14px 200px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: auto;
}

.msg { display: flex; gap: 10px; align-items: flex-end; max-width: 100%; }
.msg--bot { justify-content: flex-start; }
.msg--user { justify-content: flex-end; }

.avatar {
  flex: 0 0 auto;
  width: 42px; height: 42px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--bg-cream);
  display: flex; align-items: center; justify-content: center;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar .av-fb { display: none; width: 100%; height: 100%; }

.bubble {
  position: relative;
  max-width: min(82%, 520px);
  padding: 13px 17px;
  border-radius: var(--radius-lg);
  font-size: clamp(0.95rem, 1.6vw, 1.02rem);
  line-height: 1.5;
  white-space: pre-line;
  word-break: break-word;
}
.msg--bot .bubble {
  background: var(--color-primary-dark-blue);
  color: var(--bg-cream);
  border-bottom-left-radius: 8px;
  box-shadow: 0 6px 14px rgba(24,15,67,.12);
}
.msg--user .bubble {
  background: var(--bg-surface);
  color: var(--color-primary-dark-blue);
  border-bottom-right-radius: 8px;
  box-shadow: 0 6px 14px rgba(24,15,67,.10);
}

/* Indicador de escritura */
.typing-dots { display: inline-flex; gap: 6px; align-items: center; padding: 6px 2px; }
.typing-dots span {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--color-primary-fuchsia);
  animation: blink 1.2s infinite ease-in-out;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity:.25; transform: translateY(0);} 40% { opacity:1; transform: translateY(-4px);} }

/* ===== Chips dentro de las burbujas de mensaje ===== */
.msg .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg .chips button {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: .85rem;
  color: #fff;
  background: var(--color-primary-fuchsia);
  border: none;
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(238,69,153,.32);
  transition: transform .15s ease, box-shadow .15s ease;
}
.msg .chips button:hover { transform: translateY(-2px); }
.msg .chips button:active { transform: scale(.94); box-shadow: 0 3px 8px rgba(238,69,153,.32); }
.msg .chips button.tip--ghost {
  background: var(--bg-surface);
  color: var(--color-primary-dark-blue);
  box-shadow: 0 4px 10px rgba(24,15,67,.14);
}

/* Los chips aparecen de a uno con fade + subida (animación progresiva) */
.msg .chips button.chip-in {
  animation: chipIn .28s ease-out backwards;
}
@keyframes chipIn {
  from { opacity: 0; transform: translateY(8px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== Botón flotante "bajar" para leer mensajes largos de forma gradual ===== */
.scroll-dn {
  position: absolute;
  right: 14px;
  bottom: 82px;
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--color-primary-dark-blue);
  color: var(--bg-cream);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(24,15,67,.35);
  transition: transform .15s ease, opacity .2s ease;
  z-index: 15;
}
.scroll-dn:active { transform: scale(.9); }
.scroll-dn svg { width: 22px; height: 22px; }
.scroll-dn.hidden { opacity: 0; pointer-events: none; transform: translateY(8px); }

/* ===== Barra de entrada ===== */
.input-bar {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 780px;
  background: rgba(247,239,208,.94);
  backdrop-filter: blur(8px);
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  display: flex;
  gap: 10px;
  z-index: 20;
}
.input-bar input {
  flex: 1;
  border: none;
  border-radius: 999px;
  padding: 12px 18px;
  font-family: var(--font-body);
  font-size: 1rem;
  color: var(--color-primary-dark-blue);
  background: var(--bg-surface);
  outline: none;
  box-shadow: inset 0 0 0 2px rgba(24,15,67,.12);
  transition: box-shadow .15s ease;
}
.input-bar input::placeholder { color: rgba(24,15,67,.45); }
.input-bar input:focus { box-shadow: inset 0 0 0 2px rgba(24,15,67,.35); }
.send-btn {
  flex: 0 0 auto;
  width: 50px; height: 50px;
  border-radius: 50%;
  border: none;
  background: var(--bg-gradient-warm);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(238,69,153,.32);
  transition: transform .15s ease, box-shadow .15s ease;
}
.send-btn:hover { transform: translateY(-2px); }
.send-btn:active { transform: scale(.93); box-shadow: 0 3px 8px rgba(238,69,153,.32); }

/* ===== Botón flotante FAB (igual que fab-button en otras pantallas) ===== */
.fab {
  position: fixed;
  right: 16px; bottom: 16px;
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 2px solid var(--color-primary-white);
  background: var(--bg-gradient-warm);
  color: #fff;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,.3);
  z-index: 60;
  transition: transform .15s ease-in-out, box-shadow .15s ease-in-out;
  overflow: hidden;
}
.fab:hover { transform: scale(1.10); }
.fab:active { transform: scale(.95); }
.fab img {
  width: 24px; height: 24px;
}

.chat-area::-webkit-scrollbar { width: 8px; }
.chat-area::-webkit-scrollbar-thumb { background: rgba(24,15,67,.2); border-radius: 999px; }

@media (max-width: 480px) {
  .msg--bot .bubble { max-width: 88%; }
  .avatar { width: 36px; height: 36px; }
}
</style>
</head>

<!-- =============================================================
     MOTOR DE CHAT LUKA$H  v3
     Reglas clave (LUKASH_IA.md):
     1. Hablar lo menos necesario: 1-2 burbujas cortas por respuesta.
     2. Saludo breve, sin entrevistas largas.
     3. Sin emojis.
     4. No abrumar con preguntas predeterminadas: se pregunta
        progresivamente SOLO cuando el tema lo necesita (ingreso,
        gastos, deudas, metas) y se responde con los datos de cada
        usuario.
     5. Curso rápido de 9 lecciones + libre preguntar lo que quiera.
     ============================================================= -->
<script>
(function () {

  /* ================= 1. UTILIDADES ================= */
  const $ = (id) => document.getElementById(id);
  const chatArea = $('chatArea'), sugBox = $('suggestions'), input = $('chatInput');
  const nf = new Intl.NumberFormat('es-CO');
  const fmt = (n) => '$' + nf.format(Math.round(n));
  const round = (n, base) => Math.round(n / base) * base;

  // Normalización: minúsculas, sin tildes, espacios simples
  const norm = (t) => ('' + t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();

  const store = {
    get(key, fb) { try { const v = localStorage.getItem(key); return v === null ? fb : v; } catch { return fb; } },
    set(key, val) { try { localStorage.setItem(key, val); } catch {} },
    del(key) { try { localStorage.removeItem(key); } catch {} }
  };

  // Cuando el chat se abre desde el index (?nueva=1) SIEMPRE arranca limpio:
  // sin historial de conversacion ni progreso guardado, como si fuera la
  // primera vez. El nombre y el perfil del usuario se conservan.
  if (/[?&]nueva=1/.test(window.location.search)) {
    ['lukash-convo', 'lukash-state'].forEach(k => store.del(k));
  }

  /* --- Números COP --- */
  // "600.000", "200 mil", "1.5 millones", "60k"
  const parseMoney = (t) => {
    let s = ('' + t).toLowerCase().replace(/lucas/g, ' mil ').replace(/,/g, '');
    s = s.replace(/(\d)\.(?=\d{3}(?!\d))/g, '$1');
    let m = s.match(/(\d+(?:\.\d+)?)\s*(?:millones|millon|m)\b/);
    let n = m ? Number(m[1]) * 1000000 : null;
    if (!n) { m = s.match(/(\d+(?:\.\d+)?)\s*mil\b/); if (m) n = Number(m[1]) * 1000; }
    if (!n) { m = s.match(/(\d+(?:\.\d+)?)k\b/); if (m) n = Number(m[1]) * 1000; }
    if (!n) {
      const md = s.match(/\d(?:[\d.]*\d){0,6}/g) || [];
      const nums = md.map(z => Number(z)).filter(v => v > 100);
      if (nums.length) n = Math.max(...nums);
    }
    return n && n > 99 ? Math.round(n) : null;
  };
  // "6 meses", "2 años", "1 semestre", "5 semanas"
  const parseMonths = (t) => {
    const m = ('' + t).toLowerCase().match(/(\d{1,3})\s*(mes|meses|a[ñn]os?|semestre|semanas)/i);
    if (!m) return null;
    const n = Number(m[1]);
    const unit = m[2] || '';
    if (/seman/.test(unit)) return Math.max(1, Math.min(240, Math.round(n / 4.35)));
    if (/semestre/.test(unit)) return Math.max(1, Math.min(240, n * 6));
    if (/a[ñn]os?/.test(unit)) return Math.max(1, Math.min(240, n * 12));
    return Math.max(1, Math.min(240, n));
  };
  const delay = (ms) => new Promise(r => setTimeout(r, ms));

  /* ================= 2. MATCHER DE INTENCIONES ================= */
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const phrasePats = (tokens) => tokens.map(tk => {
    if (/^[a-zñ0-9]+$/.test(tk)) return new RegExp('\\b' + escRe(tk) + '\\b');
    return new RegExp(escRe(tk).replace(/\s+/g, '\\s+'));
  });

  const MATCHERS = [
    { id: 'curso', t: ['curso', 'aprender', 'ensename', 'ensename jugando', 'educame', 'no se nada', 'principiante', 'por donde empiezo'] },
    { id: 'goalin', t: ['calcular una meta', 'cuanto deberia ahorrar', 'cuanto ahorro', 'que meta'] },
    { id: 'goal', t: ['meta', 'viaje', 'celular', 'comprar', 'comprarme', 'comprar algo', 'objetivo', 'conseguir', 'quiero comprar', 'para el viaje', 'ahorrar para'] },
    { id: 'ahorro', t: ['ahorrar', 'ahorro', 'guardar plata', 'guardar', 'mesada', 'juntar', 'alcancia', 'apartar', 'plata guardada'] },
    { id: 'presupuesto', t: ['presupuesto', 'repartir', 'gastos', 'me llega', 'sueldo', 'ingresos', 'organizar mi plata', 'organizar mi dinero', 'como reparto', 'no me alcanza', 'me alcanza', 'en que se fue', 'en que se va', 'plan de gastos', 'fin de mes', 'gasto mucho'] },
    { id: 'deudas', t: ['deuda', 'deudas', 'debo', 'me endeude', 'me atrase', 'me atrace', 'debo plata', 'minimos', 'organizar deudas', 'estoy debiendo', 'andin enredadas'] },
    { id: 'tarjeta', t: ['tarjeta', 'cupo', 'cuotas', 'pago minimo', 'el plastico', 'diferido', 'meses sin interes', 'financiado', 'credito', 'que tarjeta me conviene', 'que tarjeta me recomiendas'] },

  ];
  MATCHERS.forEach(it => { it.pats = phrasePats(it.t); });

  function detect(text) {
    const u = norm(text);
    // Seguridad ante todo
    if (/clave|contrasena|pin|password|numero (completo )?de (tarjeta|cuenta)/.test(u)) return 'limite';
    if (/volver al inicio|otro tema|menu principal|volver al menu|al inicio/.test(u)) return 'hub';
    if (/borrar (la )?conversacion|eliminar (la )?conversacion|borrar historial|borrar todo|empezar de nuevo|empezar de cero|empezar limpio|comenzar de nuevo|comenzar de cero/.test(u)) return 'fresh';
    if (/vida crediticia|historial crediticio|primer credito|primera tarjeta|crear historial|tarjetas? para empezar|recomiend(a|ame) tarjetas?/.test(u)) return 'credito-inicio';
    if (/tarjeta|cupo|cuota|pago minimo|el plastico|diferido|sin interes/.test(u)) return 'tarjeta';
    if (/deuda|debo|me endeude|me atrase|me atrace/.test(u)) return 'deudas';
    // Si el usuario menciona un banco o billetera por su nombre, lo priorizamos
    if (bankFor(u)) return 'bancos';
    let best = { id: 'fallback', score: 0 };
    for (const it of MATCHERS) {
      const sc = it.pats.filter(r => r.test(u)).length;
      if (sc > best.score) best = { id: it.id, score: sc };
    }
    return best.id;
  }

  /* ================= 3. ESTADO Y MEMORIA ================= */
  const state = {
    name: store.get('lukash-name', ''),

    convo: [],
    used: new Set(),
    pending: null,      // esperando un dato (texto o número)
    buf: {},            // contexto temporal de la pregunta en curso
    lastTopic: null,
    menuFactory: null,
    courseOffered: false,
    purposeShown: false,
    fallbackCount: 0,
    curso: { step: 0, active: false, done: false }
  };

  (function loadMemory() {
    try {
      const c = JSON.parse(store.get('lukash-convo', '[]')); state.convo = Array.isArray(c) ? c : [];
    } catch { state.convo = []; }
    try {
      const s = JSON.parse(store.get('lukash-state', '{}')); state.used = new Set(s.used || []);
      if (s.curso) state.curso = s.curso;
      state.courseOffered = s.courseOffered === true;
      state.purposeShown = s.purposeShown === true;
      state.fallbackCount = s.fallbackCount || 0;
    } catch { state.used = new Set(); }
  })();

  const persistState = () => store.set('lukash-state', JSON.stringify({ used: [...state.used], curso: state.curso, courseOffered: state.courseOffered, purposeShown: state.purposeShown }));
  const persistConvo = () => store.set('lukash-convo', JSON.stringify(state.convo.slice(-120)));
  const saveProfile = () => store.set('lukash-profile', JSON.stringify(state.profile || {}));

  /* ================= 4. RENDERIZADO ================= */
  function svgFallback() {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 64 64');
    svg.classList.add('av-fb');
    const parts = [
      ['ellipse', { cx: 32, cy: 38, rx: 20, ry: 18, fill: '#EE4599' }],
      ['path', { d: 'M16 30 Q10 18 22 16 Q20 28 22 32 Z', fill: '#180F43' }],
      ['path', { d: 'M48 30 Q54 18 42 16 Q44 28 42 32 Z', fill: '#180F43' }],
      ['ellipse', { cx: 32, cy: 42, rx: 10, ry: 8, fill: '#E7C11F' }],
      ['circle', { cx: 28, cy: 42, r: 1.8, fill: '#180F43' }],
      ['circle', { cx: 36, cy: 42, r: 1.8, fill: '#180F43' }],
      ['circle', { cx: 24, cy: 32, r: 3.2, fill: '#fff' }],
      ['circle', { cx: 40, cy: 32, r: 3.2, fill: '#fff' }],
      ['circle', { cx: 24, cy: 32, r: 1.4, fill: '#180F43' }],
      ['circle', { cx: 40, cy: 32, r: 1.4, fill: '#180F43' }]
    ];
    parts.forEach(([tag, attrs]) => {
      const el = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
      svg.appendChild(el);
    });
    return svg;
  }
  function avatarEl() {
    const wrap = document.createElement('div');

    img.alt = 'Luka$h';

  }
  // ===== Scroll "no saltar al fondo": el usuario lee a su ritmo =====
  // Si el usuario subió el scroll, no lo jalemos; mostramos el botón "bajar"
  // y él avanza de forma GRADUAL. Si está pegado al fondo, seguimos suavemente.
  const scrollDnBtn = document.getElementById('scrollDnBtn');
  let userAway = false;   // true cuando el usuario se aleja del fondo (está leyendo)
  let rafId = 0;
  const nearBottom = () => chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight < 90;
  function updateScrollDnBtn() {
    if (!scrollDnBtn) return;
    const show = userAway && chatArea.scrollHeight > chatArea.clientHeight + 90;
    scrollDnBtn.classList.toggle('hidden', !show);
  }
  chatArea.addEventListener('scroll', () => { userAway = !nearBottom(); updateScrollDnBtn(); });
  window.addEventListener('resize', () => { userAway = !nearBottom(); updateScrollDnBtn(); });

  // Avance suave con desaceleración (no salto brusco al final)
  function animateScrollTo(target) {
    cancelAnimationFrame(rafId);
    const step = () => {
      const r = target - chatArea.scrollTop;
      if (r < 2) { chatArea.scrollTop = target; return; }
      chatArea.scrollTop += Math.max(3, r * 0.16);
      rafId = requestAnimationFrame(step);
    };
    rafId = requestAnimationFrame(step);
  }

  function scrollDown(force) {
    requestAnimationFrame(() => {
      if (!force && userAway) { updateScrollDnBtn(); return; }
      animateScrollTo(chatArea.scrollHeight);
    });
  }

  // Botón "bajar": un paso por pulsación, NO un salto al fondo
  if (scrollDnBtn) scrollDnBtn.addEventListener('click', () => {
    const paso = Math.max(chatArea.clientHeight * 0.65, 180);
    animateScrollTo(Math.min(chatArea.scrollTop + paso, chatArea.scrollHeight));
  });

  function renderRow(type, text) {
    const row = document.createElement('div');
    row.className = 'msg msg--' + type;
    if (type === 'bot') row.appendChild(avatarEl());
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatArea.appendChild(row);
    scrollDown();
  }
  function addMessage(type, text) {
    renderRow(type, text);
    state.convo.push({ r: type, t: text });
    persistConvo();
  }
  function setTyping(on) {
    let t = document.getElementById('typingRow');
    if (on && !t) {
      const row = document.createElement('div');
      row.className = 'msg msg--bot';
      row.id = 'typingRow';
      row.appendChild(avatarEl());
      const b = document.createElement('div');
      b.className = 'bubble';
      b.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
      row.appendChild(b);
      chatArea.appendChild(row);
      scrollDown();
    } else if (!on && t) t.remove();
  }

  // Chips solo en puntos de decisión reales; se quitan al usarse salvo los reutilizables
  const REUSABLE = new Set(['Volver al inicio', 'Preguntar otra cosa', 'Otro tema', 'Continuar el curso', 'Verificar información']);

  // Opciones: primero la recomendada (marcada con "*"), luego las útiles del tema
  // y al final la de escape; MÁXIMO 3 por turno para no abrumar al usuario.
  function orderChips(labels) {
    const rec = [], esc = [], rest = [];
    (labels || []).forEach(label => {
      const n = norm(label);
      if (state.used.has(n) && !REUSABLE.has(n)) return;
      if (/^\*/.test(label)) rec.push(label.replace(/^\*/, ''));
      else if (REUSABLE.has(n)) esc.push(label);
      else rest.push(label);
    });
    let picks = rec.concat(rest).slice(0, 3);
    if (esc.length && picks.length >= 3) picks = picks.slice(0, 2);
    picks = picks.concat(esc.slice(0, 3 - picks.length));
    return picks.slice(0, 3);
  }

  function renderChips(labels, container) {
    if (!container) {
      // Si no hay contenedor, agregamos dentro de la última burbuja bot
      const lastBot = chatArea.querySelector('.msg--bot:last-child');
      if (lastBot) {
        container = lastBot.querySelector('.chips') || document.createElement('div');
        if (!lastBot.querySelector('.chips')) {
          container.className = 'chips';
          lastBot.appendChild(container);
        }
      }
    }
    container.innerHTML = '';
    const final = orderChips(labels);
    if (!final.length) return;
    // Los chips aparecen de a UNO (~210ms) para leerlos de forma progresiva.
    final.forEach((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip-in';
      b.textContent = label;
      if (REUSABLE.has(norm(label))) b.classList.add('tip--ghost');
      b.addEventListener('click', () => {
        if (!REUSABLE.has(norm(label))) state.used.add(norm(label));
        persistState();
        container.innerHTML = '';
        handleUser(label);
      });
      setTimeout(() => { container.appendChild(b); scrollDown(); }, 210 * i);
    });
    // Al terminar la secuencia, acomodamos la vista si el usuario está abajo
    setTimeout(() => scrollDown(), 210 * final.length + 60);
  }

  /* ================= 5. LUKA$H HABLA (1-2 burbujas cortas) ================= */
  let continueMap = Object.create(null);
  const on = (label, fn) => { continueMap[norm(label)] = fn; };
  const clearMap = () => { continueMap = Object.create(null); };

  async function botTalk(texts, chips) {
    texts = (texts || []).slice(0, 2);
    setTyping(true);
    for (let i = 0; i < texts.length; i++) {
      await delay(300 + Math.min(460, texts[i].length * 4));
      setTyping(false);
      addMessage('bot', texts[i]);
      setTyping(i < texts.length - 1);
    }
    setTyping(false);
    if (chips && chips.length) renderChips(chips, null);
  }

  /* ================= 6. HUB (temas abiertos) ================= */
  const HUB_TOPICS = ['Presupuesto', 'Ahorro', 'Meta', 'Deudas', 'Invertir', 'Curso'];
  function hubChips() {
    const rest = HUB_TOPICS.filter(l => !state.used.has(norm(l)));
    const base = rest.length ? rest : ['Preguntar otra cosa'];
    if (state.curso && state.curso.active && !state.curso.done) base.unshift('Continuar el curso');
    return base;
  }
  function goHub(lead) {
    clearMap();
    state.lastTopic = null; state.menuFactory = null;
    state.pending = null;
    botTalk([lead || '¿De qué hablamos?'], hubChips());
  }

  // Se construye SOLO con preguntas que el tema necesita, una a la vez
  const hasIncome = () => typeof state.profile.income === 'number';
  const hasExpenses = () => typeof state.profile.expenses === 'number';

  /* ================= 8. PRESUPUESTO ================= */
  // Pregunta ingreso -> gastos -> divide y usa los números del usuario
  function topPresupuesto() {
    state.lastTopic = 'presupuesto';
    clearMap();
    if (hasIncome()) return presupuestoNext();
    state.pending = 'income-presupuesto';
    botTalk(['¿Cuánto recibes al mes, más o menos?'], ['200.000', '500.000', '800.000', '1.500.000']);
  }
  function presupuestoNext() {
    state.lastTopic = 'presupuesto';
    if (!hasExpenses()) {
      state.pending = 'expenses';
      botTalk(['Y con eso, ¿te alcanza para el mes o te queda justo?'], ['Me alcanza', 'Me queda justo', 'No me alcanza']);
      return;
    }
    presupuestoResult();
  }
  function presupuestoResult() {
    const inc = state.profile.income;
    const exp = state.profile.expenses;
    const nec = round(inc * 0.5, 1000), gust = round(inc * 0.3, 1000), aho = round(inc * 0.2, 1000);
    const bal = inc - exp;
    clearMap();
    const b1 = 'Con ' + fmt(inc) + ' al mes: ' + fmt(nec) + ' a necesarios, ' + fmt(gust) + ' a gustos y ' + fmt(aho) + ' a ahorro.';
    let b2;
    if (bal >= 0) {
      b2 = 'Con tus gastos (' + fmt(exp) + ') te quedan ' + fmt(bal) + ' libres. Aparta el ahorro el día que te llega la plata.';
    } else {
      b2 = 'Ojo: gastas ' + fmt(-bal) + ' más de lo que entra. Primero lo fijo no se toca: recorta de gustos y gastos hormiga.';
    }
    state.pending = null;
    on('Ponte un reto', topReto);
    botTalk([b1, b2], ['Ponte un reto', 'Preguntar otra cosa']);
  }

  /* ================= 9. METAS Y COMPRAS ================= */
  // Pregunta cuánto -> en cuánto tiempo -> (ingreso si hace falta) -> plan propio
  function topMeta(text) {
    state.lastTopic = 'meta';
    clearMap();
    const pm = parseMoney(text), pmo = parseMonths(text);
    if (pm && pmo) return goalDo(pm, pmo);
    state.buf = {};
    state.pending = 'goal-amount';
    botTalk(['¡Vamos por esa meta! ¿Cuánto necesitas juntar?'], ['600.000', '1.200.000', '2.000.000']);
  }
  function goalDo(amount, months) {
    const monthly = amount / months;
    state.buf.meta = { amount, months, monthly };
    // Si no conocemos el ingreso, lo pedimos para hacer el plan personal
    if (!hasIncome()) {
      state.pending = 'income-meta';
      botTalk(['Para mirar que te quepa, ¿cuánto recibes al mes?'], ['300.000', '600.000', '1.000.000']);
      return;
    }
    goalPlan();
  }
  function goalPlan() {
    const m = state.buf.meta;
    const inc = state.profile.income;
    const ahorroSug = round(inc * 0.2, 1000);
    const pct = Math.round(m.monthly / inc * 100);
    clearMap();
    state.pending = null;
    const b1 = 'Para juntar ' + fmt(m.amount) + ' en ' + m.months + ' meses, aparta ' + fmt(m.monthly) + ' al mes.';
    let b2;
    if (pct > 20) {
      b2 = 'Es el ' + pct + '% de tu ingreso, más del 20% sano. Alarga el plazo o bájale a un gasto.';
    } else {
      b2 = 'Te cabe en el ahorro (tu 20% sería ' + fmt(ahorroSug) + '). Metálico: apenas llegue la plata, lo apartas.';

  }

  /* ================= 17. RETO Y ESCENARIO ================= */
  function topReto() {
    state.lastTopic = 'reto';
    clearMap();
    const base = round(state.profile.income || 600000, 1000);
    const need = round(base * 0.4, 1000);
    const rest = base - need;
    const gA = round(rest * 0.60, 1000), aA = rest - gA;
    const gB = round(rest * 0.40, 1000), aB = rest - gB;
    const gC = round(rest * 0.15, 1000), aC = rest - gC;
    state.reto = { need, aA, aB, aC };
    const labA = 'A) gustos ' + fmt(gA) + ' y ahorro ' + fmt(aA);
    const labB = 'B) gustos ' + fmt(gB) + ' y ahorro ' + fmt(aB);
    const labC = 'C) gustos ' + fmt(gC) + ' y ahorro ' + fmt(aC);
    on(labA, () => retoFeedback('A'));
    on(labB, () => retoFeedback('B'));
    on(labC, () => retoFeedback('C'));
    botTalk([
      'Te llegan ' + fmt(base) + ' al mes y ' + fmt(need) + ' son de necesarios.',
      'El resto (' + fmt(rest) + ') es para gustos y ahorro. ¿Cómo lo repartes?'
    ], [labA, labB, labC, 'Preguntar otra cosa']);
  }
  function retoFeedback(opt) {
    const v = state.reto;
    clearMap();
    on('Otro reto', topReto);
    let b;
    if (opt === 'A') b = 'Opción A: los gustos ganan y el ahorro queda flaquito (' + fmt(v.aA) + '). El ahorro no es lo que sobra: se aparta primero.';
    else if (opt === 'B') b = 'Opción B: pareja. Necesarios cubiertos, gustos disfrutan y ahorras (' + fmt(v.aB) + '). Eso es sostenible.';
    else b = 'Opción C: ' + fmt(v.aC) + ' de golpe no aguanta ni un mes. Mejor poco y constante que mucho una vez.';
    botTalk([b], ['Otro reto', 'Preguntar otra cosa']);
  }

  function cursoMenu() {

  function topCurso() {
    clearMap();
    state.lastTopic = 'curso';
    if (!state.curso.active || state.curso.done) { state.curso.step = 0; state.curso.active = true; state.curso.done = false; }
    cursoMenu();
  }
  function resumeCurso() {
    clearMap();
    state.lastTopic = 'curso';
    if (!state.curso.active || state.curso.done) return topCurso();
    cursoRender();
  }
  function cursoRender() {
    const i = Math.min(state.curso.step, CURSO.length - 1);
    const isLast = i >= CURSO.length - 1;
    const lec = CURSO[i];
    const actLabel = lec.act.label;
    on(actLabel, cursoAct);
    on('Siguiente', nextCurso);
    on('Terminar', endCurso);
    on('Preguntar otra cosa', leaveCurso);
    const chips = [actLabel, isLast ? 'Terminar' : 'Siguiente', 'Preguntar otra cosa'];
    state.cursoActiveAct = lec.act;
    botTalk([lec.text], chips);
  }
  function cursoAct() {
    const act = state.cursoActiveAct;
    if (!act) return topCurso();
    clearMap();
    on('Siguiente', nextCurso);
    on('Terminar', endCurso);
    on('Preguntar otra cosa', leaveCurso);
    act.opts.forEach(o => on(o, () => cursoOption(o)));
    botTalk([ACT_TEXT[act.label] || act.label], act.opts);
  }
  function cursoOption(opt) {
    const fb = FEED[opt];
    if (!fb) return cursoAct();
    const isLast = state.curso.step >= CURSO.length - 1;
    clearMap();
    if (isLast) on('Terminar', endCurso);
    on('Siguiente', nextCurso);
    on('Continuar el curso', resumeCurso);
    on('Preguntar otra cosa', leaveCurso);
    botTalk([fb], [isLast ? 'Terminar' : 'Siguiente', 'Preguntar otra cosa']);
  }
  function nextCurso() {
    state.curso.step = Math.min(state.curso.step + 1, CURSO.length - 1);
    if (state.curso.step >= CURSO.length - 1) state.curso.done = true;
    persistState();
    cursoRender();
  }
  function endCurso() {
    state.curso = { step: 0, active: false, done: false };
    persistState();
    goHub('¡Completaste el curso rápido! Ya le entiendes un poco más a tu plata.');
  }
  function leaveCurso() {
    state.curso.active = true;
    persistState();
    goHub('Tranqui, aquí no hay examen: tú mandas.');
  }

  function matchKnow(u) {
    let best = null, bs = 0;
    for (const t of KNOW) {
      if (!t._p) t._p = phrasePats(t.k);
      let s = 0;
      for (const p of t._p) if (p.test(u)) s++;
      if (s > bs) { bs = s; best = t; }
    }
    return best;
  }

  // Respuesta breve -> "Explícame más" (fibra a fibra: definición, ejemplo, consejo; máx 2 capas extra)
  function educate(topic, layer) {
    layer = layer | 0;
    clearMap();
    state.know = { topic, layer: Math.min(layer, 2) };
    state.lastTopic = 'conocimiento';
    on('Preguntar otra cosa', goHubFree);
    on('Otro tema', goHubFree);
    if (layer >= 2) {
      const warnTxt = topic.warn ? '\n' + topic.warn : '';
      state.know.layer = 2;
      botTalk([topic.tip + warnTxt], ['Preguntar otra cosa']);
      return;
    }
    if (layer === 0) {
      botTalk([topic.def], ['*Explícame más', 'Preguntar otra cosa']);
      return;
    }
    botTalk([topic.ej], ['*¿Y cómo lo aplico?', 'Preguntar otra cosa']);
  }

  // ---- CÁLCULOS AUTOMÁTICOS (detecta montos y hace la matemática) ----
  function numsOf(text) {
    return (('' + text).match(/\d[\d.,]*/g) || [])
      .map(s => Number(s.replace(/\./g, '').replace(',', '.')))
      .filter(n => isFinite(n) && n > 0);
  }
  function calculoInv(P, n) {
    clearMap();
    const i = 0.12 / 12;
    const F = P * Math.pow(1 + i, n);
    const simple = P + (P * 0.12 * n / 12);
    on('Preguntar otra cosa', goHubFree);
    botTalk([
      'Ejemplo con 12% anual (solo de referencia, las tasas reales cambian): ' + fmt(P) + ' en ' + n + ' meses pueden quedar cerca de ' + fmt(round(F, 1000)) + ' con interés compuesto.',
      'Si fuera interés simple serían ' + fmt(round(simple, 1000)) + '. La diferencia es magia que juega a tu favor cuando hay tiempo.'
    ], ['Preguntar otra cosa']);
  }
  function tryCalcular(text, u, pm, pmo, modes) {
    modes = modes || {};
    const cuotasM = modes.cuotas !== false;
    const invM = modes.invertir !== false;
    const pagoMM = modes.pagoMinimo !== false;
    const mesM = modes.mesada !== false;
    const fifM = modes.fifty !== false;
    const nums = numsOf(text);

    // A) Costo real de comprar a cuotas
    if (cuotasM && /cuotas|financiar|financiado|sin interes|diferido/.test(u) && nums.length >= 2) {
      const count = nums.find(n => Number.isInteger(n) && n >= 2 && n <= 72) || 12;
      const contado = Math.max(...nums);
      const cuotaC = nums.filter(n => n !== contado && n !== count);
      const cuota = cuotaC.length ? Math.max(...cuotaC) : null;
      if (cuota) {
        const total = cuota * count;
        const extra = total - contado;
        clearMap();
        on('Preguntar otra cosa', goHubFree);
        if (extra > 0) {
          botTalk([
            'Pilas: ' + count + ' cuotas de ' + fmt(cuota) + ' = ' + fmt(total) + ' por algo de ' + fmt(contado) + '.',
            'Son ' + fmt(extra) + ' de más (' + Math.round(extra / contado * 100) + '% de recargo). Compara la tasa efectiva anual antes de firmar.'
          ], ['Preguntar otra cosa']);
        } else {
          botTalk([
            count + ' cuotas de ' + fmt(cuota) + ' suman ' + fmt(total) + '.',
            'Si el precio de contado es el mismo, no estás perdiendo: igual revisa que se hable de "sin interés" en las condiciones.'
          ], ['Preguntar otra cosa']);
        }
        return true;
      }
      // Sin precio de contado: mostramos cuánto se paga en total por las cuotas
      const rest2 = nums.filter(n => !(Number.isInteger(n) && n >= 2 && n <= 72));
      const soloCuota = rest2.length === 1 ? rest2[0] : null;
      if (soloCuota) {
        const total = soloCuota * count;
        clearMap();
        on('Preguntar otra cosa', goHubFree);
        botTalk([
          'Son ' + count + ' cuotas de ' + fmt(soloCuota) + ': en total ' + fmt(total) + '.',
          'Para saber cuánto pagas de más, dime cuánto vale de contado y lo comparo.'
        ], ['Preguntar otra cosa']);
        return true;
      }
    }

    // B) Ahorro mensual por un plazo (mesada que crece con el tiempo)
    if (mesM && pm && pmo && /apart|ahorr|guardar|dejar|junto|mesada|mensual/.test(u) && /cuanto (tendre|tengo|sera|puedo|termino|junto)|rinde|crece|interes|acumulo/.test(u)) {
      const total = pm * pmo;
      clearMap();
      on('Preguntar otra cosa', goHubFree);
      botTalk([
        'Si apartas ' + fmt(pm) + ' al mes durante ' + pmo + ' meses, sin intereses juntas ' + fmt(total) + '.',
        'Y si ese ahorro rinde, crece más. Tu constancia, eso no lo banca ninguna app.'
      ], ['Preguntar otra cosa']);
      return true;
    }

    // C) Invertir un monto: interés compuesto de ejemplo
    if (invM && pm && /invert|rendir|rinde|cuanto (saco|sacaria|saca|gana|rinde)|si meto|si pongo|lo dejo|me genera|crece|interes/.test(u)) {
      if (!pmo) {
        clearMap();
        state.buf.inv = pm;
        on('6 meses', () => calculoInv(state.buf.inv, 6));
        on('12 meses', () => calculoInv(state.buf.inv, 12));
        on('3 meses', () => calculoInv(state.buf.inv, 3));
        botTalk(['¿En cuánto tiempo lo dejas?'], ['6 meses', '12 meses']);
        return true;
      }
      calculoInv(pm, pmo);
      return true;
    }

    // D) Pago mínimo estimado
    if (pagoMM && /pago minimo|minimo de|solo el minimo/.test(u) && pm) {
      const est = round(pm * 0.05, 1000);
      clearMap();
      on('Preguntar otra cosa', goHubFree);
      botTalk([
        'Con saldo de ' + fmt(pm) + ', el mínimo suele rondar ~' + fmt(est) + ' (es una aproximación, no la cifra exacta).',
        'Pero el mínimo casi no mueve la deuda y deja el resto girando con interés: paga el total o lo máximo que puedas.'
      ], ['Preguntar otra cosa']);
      return true;
    }

    // E) Regla 50/30/20
    if (fifM && /50 ?\/ ?30 ?\/ ?20|50 ?30 ?20|regla 50|repartir mi ingreso/.test(u)) {
      const ing = pm || state.profile.income;
      if (!ing) {
        state.pending = 'income-presupuesto';
        botTalk(['Para el 50/30/20 necesito tu ingreso mensual:'], ['500.000', '1.000.000', '1.500.000']);
        return true;
      }
      const nec = round(ing * 0.5, 1000), gust = round(ing * 0.3, 1000), aho = round(ing * 0.2, 1000);
      clearMap();
      on('Preguntar otra cosa', goHubFree);
      botTalk([
        'Con ' + fmt(ing) + ' al mes: ' + fmt(nec) + ' a necesario, ' + fmt(gust) + ' a gustos y ' + fmt(aho) + ' a ahorro.',
        'Ajusta los porcentajes a tu realidad: lo importante es que el ahorro se aparte primero.'
      ], ['Preguntar otra cosa']);
      return true;
    }

    return false;
  }

  const CHISTE_RE = /jaja|chiste|broma|cantar|musica|mascota|perro|gato|futbol|gol|videojuego|pelicula|serie|farandula|chisme|amor|corazon|novi|amigo|amiga|que tal tu dia|como estas/;
  const TOPIC_FLOWS = {
    'Presupuesto': topPresupuesto,
    'Ahorro': topAhorro,
    'Ponerle una meta': topMeta,
    'Deudas': topDeudas,
    'Tarjeta': topTarjeta,

  function clarifyChips(u) {
    const dict = [
      ['Presupuesto', /plata|gasto|gastar|mes|sueldo|ingreso|recibo|alcanza|cobro|llego|salario/],
      ['Ahorro', /ahorr|guard|jun|apart|fondo/],
      ['Ponerle una meta', /meta|objetivo|compra|comprar|juntar/],
      ['Deudas', /deuda|debo|prestamo|credito/],
      ['Invertir', /invert|rend|cdt|interes|rinde|crece/],
      ['Bancos', /banco|cuenta|saldo|consignar|transferir/],
      ['Inflación', /sube|precio|cuesta|caro|barato/],
      ['Tarjeta', /tarjeta|cupo|visa|mastercard/]
    ];
    const picks = dict.filter(([, re]) => re.test(u)).map(([l]) => l);
    return picks.slice(0, 3);
  }
  function smartFallback(text, u, pm, pmo) {
    clearMap();
    state.lastTopic = null;
    state.know = null;

    // 1) Advertencia de riesgo: solo si surge
    if (riesgoPhrase(u)) {
      state.fallbackCount = 0; persistState();
      botTalk([
        'Un momento: eso huele a oferta que termina costando carísimo. Nadie te asegura plata sin riesgo, y menos en un chat.',
        'Lo sano: entidad vigilada, tasa efectiva anual real y leer antes de firmar. Verifica en la Superintendencia antes de dar plata o datos.'
      ], ['Preguntar otra cosa']);
      return;
    }

    // 2) Temas no financieros: humor breve + redirección
    if (CHISTE_RE.test(u)) {
      botTalk([
        'Jaja, de eso no ando tan ducho, yo soy más de números que de farándula.',
        'Pero hablando de plata: ¿vemos ahorro, deudas, presupuesto o cómo hacer que rinda?'
      ], ['Preguntar otra cosa']);
      return;
    }

    // 3) Montos sin contexto: ofrecer armar la meta
    if (pm && pmo && !/cuanto|cuesta|precio|vale/.test(u)) {
      on('Armar esa meta', () => goalDo(pm, pmo));
      on('Preguntar otra cosa', goHubFree);
      botTalk([
        'Veo montos y tiempos: ' + fmt(pm) + ' en ' + pmo + ' meses. Puedo armar el plan de cuánto apartar.',
        '¿Lo armamos?'
      ], ['*Armar esa meta', 'Preguntar otra cosa']);
      return;
    }

    // 4) Interpretar por afinidad y preguntar
    const picks = clarifyChips(u);
    const chips = (picks.length ? picks : ['Presupuesto', 'Ahorro', 'Deudas']).concat(['Preguntar otra cosa']);
    chips.forEach(l => { if (TOPIC_FLOWS[l]) on(l, TOPIC_FLOWS[l]); });
    let extra = null;
    if (state.fallbackCount >= 2) {
      state.fallbackCount = 0;
      extra = ' Además, si quieres bases claras, te regalo el curso rápido.';
      on('Curso rápido', topCurso);
    } else {
      state.fallbackCount = (state.fallbackCount || 0) + 1;
    }
    persistState();
    botTalk([
      'No te quedas sin respuesta: lo que dices suena a ' + (picks.length ? picks.join(', ') : 'temas de finanzas') + '.',
      '¿Miramos ese tema?' + (extra || '')
    ], chips);
  }

  /* ================= 21. PASOS QUE ESPERAN NÚMEROS O TEXTOS ================= */
  async function handlePending(text, u, pm) {
    const canSkip = state.pending !== 'name' && /^(no quiero|prefiero no|no deseo|paso|saltar|no por ahora|no se|no sé|no tengo claro)/.test(u);
    if (canSkip) {
      state.pending = null;
      return botTalk(['Está bien, no tienes que responder. Ese dato me ayuda a personalizar mejor, pero seguimos sin presión.'], ['Preguntar otra cosa']);
    }
    switch (state.pending) {
      case 'name': {
        state.pending = null;
        if (/omitir/i.test(u)) {
          state.namedFlag = true; store.set('lukash-named', '1');
          return goGreeting();
        }
        state.name = (('' + text).trim().slice(0, 20)) || 'Amigo';
        store.set('lukash-name', state.name);
        return goGreeting();
      }
      case 'income-presupuesto': {
        const inc = pm || parseMoney(text);
        if (!inc) return botTalk(['No capté el monto. Escríbelo así: 500.000 o 2 millones.'], ['500.000']);
        state.profile.income = inc; saveProfile();
        state.pending = null;
        return presupuestoNext();
      }
      case 'edit-income': {
        const inc = pm || parseMoney(text);
        if (!inc) return botTalk(['No capté el monto. Escríbelo así: 500.000 o 2 millones.']);
        state.profile.income = inc; saveProfile(); state.pending = null;
        return botTalk(['Listo, actualicé tu ingreso mensual a ' + fmt(inc) + '.'], ['Preguntar otra cosa']);
      }
      case 'edit-expenses': {
        const expenses = pm || parseMoney(text);
        if (!expenses) return botTalk(['No capté el monto. Escríbelo así: 300.000.']);
        state.profile.expenses = expenses; saveProfile(); state.pending = null;
        return botTalk(['Listo, actualicé tus gastos mensuales a ' + fmt(expenses) + '.'], ['Preguntar otra cosa']);
      }
      case 'edit-debt': {
        const debt = pm || parseMoney(text);
        if (!debt) return botTalk(['No capté el monto. Escríbelo así: 1.500.000.']);
        state.profile.debtTotal = debt; saveProfile(); state.pending = null;
        return botTalk(['Listo, actualicé tu deuda total a ' + fmt(debt) + '.'], ['Preguntar otra cosa']);
      }
      case 'expenses': {
        state.pending = null;
        const inc = state.profile.income;
        if (/no me alcanza/i.test(u)) state.profile.expenses = Math.round(inc * 1.2);
        else if (/me queda justo/i.test(u)) state.profile.expenses = inc;
        else state.profile.expenses = Math.round(inc * 0.8);
        saveProfile();
        return presupuestoResult();
      }
      case 'goal-amount': {
        const amount = pm || parseMoney(text);
        if (!amount) return botTalk(['No capté el valor. Escríbelo como número: 600.000.'], ['600.000']);
        const months = parseMonths(text);
        if (months) return goalDo(amount, months);
        state.pending = 'goal-months';
        state.buf.goalAmount = amount;
        botTalk([fmt(amount) + ', anotado. ¿En cuántos meses lo armas?'], ['3 meses', '6 meses', '12 meses']);
        return;
      }
      case 'goal-months': {
        let months = parseMonths(text);
        if (!months) { const n = parseInt(text, 10); months = (n > 0 && n <= 240) ? n : null; }
        if (!months) return botTalk(['Dame un número de meses, ej: 6.'], ['6 meses']);
        const amount = state.buf.goalAmount || pm;
        delete state.buf.goalAmount;
        state.pending = null;
        return goalDo(amount, months);
      }
      case 'income-meta': {
        const inc = pm || parseMoney(text);
        if (!inc) return botTalk(['No capté el ingreso. Ej: 500.000.'], ['500.000']);
        state.profile.income = inc; saveProfile();
        state.pending = null;
        return goalPlan();
      }
      case 'goal-saved': {
        state.pending = null;
        let saved = 0;
        if (!/nada/i.test(u)) saved = pm || parseMoney(text) || 0;
        const m = state.buf.meta;
        const falta = m.amount - saved;
        clearMap();
        if (falta <= 0) return botTalk(['Ya tienes cubierta esa meta. O subes la meta o la plata busca otro plan.'], ['Preguntar otra cosa']);
        const nuevo = falta / m.months;
        botTalk([
          'Con ' + fmt(saved) + ' guardados, te faltan ' + fmt(falta) + '.',
          'Te tocaría apartar ' + fmt(nuevo) + ' al mes en ' + m.months + ' meses.'
        ], ['Preguntar otra cosa']);
        return;
      }
      case 'debt-total': {
        const total = pm || parseMoney(text);
        if (!total) return botTalk(['Dame el total en números, ej: 2.000.000.'], ['2.000.000']);
        state.profile.debtTotal = total; saveProfile();
        state.pending = 'debt-month';
        botTalk(['¿Cuánto pagas al mes por esa deuda?'], ['100.000', '300.000', '500.000']);
        return;
      }
      case 'debt-month': {
        const pay = pm || parseMoney(text);
        if (!pay) return botTalk(['Dame el pago mensual en números, ej: 200.000.'], ['200.000']);
        state.profile.debtMonthly = pay; saveProfile();
        if (!hasIncome()) {
          state.pending = 'income-debts';
          botTalk(['¿Y cuánto recibes al mes, para ver el peso?'], ['300.000', '700.000', '1.200.000']);
          return;
        }
        state.pending = null;
        return debtRatio();
      }
      case 'income-debts': {
        const inc = pm || parseMoney(text);
        if (!inc) return botTalk(['No capté el ingreso. Ej: 700.000.'], ['700.000']);
        state.profile.income = inc; saveProfile();
        state.pending = null;
        return debtRatio();
      }
      case 'card-debt': {
        const total = pm || parseMoney(text);
        clearMap();
        state.pending = null;
        if (!total) return botTalk(['Dame el número, ej: 1.500.000.'], ['1.500.000']);
        const costo = Math.round(total * 1.6);
        botTalk([
          'Con ' + fmt(total) + ' de deuda en la tarjeta, pagando solo mínimo puedes terminar alrededor de ' + fmt(costo) + '.',
          'Prioridad: pagar el total o lo máximo posible, y frenar el uso.'
        ], ['Preguntar otra cosa']);
        return;
      }
      case 'hormiga': {
        state.pending = null;
        const d = pm || parseMoney(text);
        if (!d || d > 50000) return topHormiga();
        const mes = d * 30, anio = d * 365;
        clearMap();
        botTalk([
          fmt(d) + ' diarios son ~' + fmt(mes) + ' al mes y ~' + fmt(anio) + ' al año.',
          'Con eso completas un viajecito. No es dejar de disfrutar: es saber cuánto pesan esos gastitos.'
        ], ['Preguntar otra cosa']);
        return;
      }
      case 'escenario': {
        state.pending = null;
        clearMap();
        if (/comprar|ya$|si([^\w]|$)/i.test(u)) return escenarioAnswer('Comprarlos ya');
        if (/esperar|24/i.test(u)) return escenarioAnswer('Esperar 24 horas');
        if (/revis|presupuesto/i.test(u)) return escenarioAnswer('Revisar mi presupuesto');
        return escenarioAnswer(null);
      }
      default:
        state.pending = null;
        return routeFree(text, u);
    }
  }
  function escenarioAnswer(opt) {
    clearMap();
    if (!opt) return botTalk(['Tienes 3 caminos: comprarlos, esperar 24h o revisar tu presupuesto.'], []);
    const b = FEED[opt];
    botTalk([b], ['Preguntar otra cosa']);
  }

  /* ================= 22. RUTA PRINCIPAL ================= */
  async function handleUser(text) {
    text = ('' + (text || '')).trim();
    if (!text) return;
    addMessage('user', text);
    input.value = '';
    scrollDown();
    const u = norm(text);
    const pm = parseMoney(text);

    // 0) Profundizar un concepto ya explicado (máx 2 capas extra: ej -> consejo)
    if (state.know && state.know.layer < 2 && u.length < 34 && /explica|expl[íi]came| mas| más|un ejemplo|ejemplo|simple|sencill|como lo aplico|consejo|detalle|dale|sigue/.test(u) && !/preguntar otra cosa|otro tema/.test(u)) {
      return educate(state.know.topic, state.know.layer + 1);
    }

    // 1) Opciones por paso (chips)
    if (continueMap[u]) { const fn = continueMap[u]; clearMap(); return fn(text); }
    // 1b) Salir al hub en cualquier momento: "Preguntar otra cosa"
    if (/preguntar otra cosa|otra cosa/.test(u)) return goHubFree();
    // 2) Atajo al curso
    if (u === norm('Curso rápido')) return topCurso();
    if (u === norm('Continuar el curso')) return resumeCurso();
    if (detect(text) === 'fresh') return routeFree(text, u);

    // 3) Datos sueltos de una pregunta pendiente
    if (state.pending && detect(text) === 'credito-inicio') {
      state.pending = null;
      return topInicioCrediticio();
    }
    if (state.pending) return handlePending(text, u, pm);

    const intent = detect(text);

    // 4) Mismo tema: retoma su menú sin repetir intro
    if (intent === state.lastTopic && state.lastTopic !== 'curso' && state.lastTopic !== 'hormiga' && state.lastTopic !== 'reto' && state.lastTopic !== 'escenario') {
      if (intent === 'presupuesto' && hasIncome()) return presupuestoResult();
      return routeFree(text, u);
    }

    return routeFree(text, u);
  }

  async function routeFree(text, u) {
    const intent = detect(text);
    const pm = parseMoney(text), pmo = parseMonths(text);
    // Nuevo contexto: se olvida la profundización de un concepto anterior
    state.know = null;

    // Pregunta directa de CONCEPTO -> respuesta breve + "Explícame más" (2 capas)
    if (esConcepto(u)) {
      const kn = matchKnow(u);
      if (kn) { clearMap(); return educate(kn, 0); }
    }

    // Pregunta directa de concepto (FAQ)
    const faq = faqAnswer(u);
    if (faq) {
      clearMap();
      return botTalk(faq, ['Preguntar otra cosa']);
    }

    switch (intent) {
      case 'limite':    return goLimits();
      case 'clarificar': return goClarify();
      case 'miedo':     return goMiedo();
      case 'quien':     return goWho();
      case 'perfil':    return goProfileEdit();
      case 'saludo':    return goGreeting();
      case 'gracias':   return goThanks();
      case 'afirma':    return goAfirma();
      case 'niega':     return goNiega();
      case 'despedida': return goDespedida();
      case 'fresh': {
        ['lukash-name', 'lukash-named', 'lukash-profile', 'lukash-convo', 'lukash-state'].forEach(k => store.del(k));
        state.name = ''; state.namedFlag = false; state.profile = {};
        state.convo = []; state.used = new Set(); state.pending = null;
        state.lastTopic = null; state.menuFactory = null; state.courseOffered = false; state.purposeShown = false;
        state.curso = { step: 0, active: false, done: false };
        persistConvo(); persistState();
        chatArea.innerHTML = ''; sugBox.innerHTML = ''; clearMap();
        return goGreeting();
      }
      case 'hub':       return goHubFree();
      case 'curso':     return topCurso();
      case 'credito-inicio': return topInicioCrediticio();
      case 'goalin':    return topAhorro();
      case 'goal':
      case 'ahorro': {
        // Camino "cuánto tendré si lo dejo/guardo": lo resuelve la calculadora
        if (/cuanto (tendre|tengo|sera|puedo|termino|junto)|rinde|crece|interes|acumulo/.test(u) && tryCalcular(text, u, pm, pmo, { invertir:false, cuotas:false, pagoMinimo:false })) {
          return;
        }
        if (intent === 'goal') {
          if (pm && pmo) return goalDo(pm, pmo);
          return topMeta(text);
        }
        if (pm) {
          state.lastTopic = 'meta'; clearMap();
          state.buf = {}; state.pending = 'goal-amount';
          return botTalk([fmt(pm) + ', anotado. ¿En cuántos meses lo armas?'], ['3 meses', '6 meses', '12 meses']);
        }
        return topAhorro();
      }
      case 'presupuesto': {
        if (pm) {
          state.profile.income = pm; saveProfile();
          // Si vienen dos montos (valor y gastos) calculamos directo
          const nums = (text.match(/(\d[\d.,]*\d)/g) || []).map(s => Number(s.replace(/\./g, '').replace(',', '.'))).filter(n => n >= 1000);
          if (nums.length >= 2) {
            const a = Math.min(...nums), b = Math.max(...nums);
            state.profile.income = b; state.profile.expenses = a; saveProfile();
            return presupuestoResult();
          }
          return presupuestoNext();
        }
        return topPresupuesto();
      }
      case 'deudas':    return topDeudas();
      case 'tarjeta':   if (tryCalcular(text, u, pm, pmo, { invertir:false, mesada:false })) return; return topTarjeta();
      case 'invertir':  if (tryCalcular(text, u, pm, pmo, { mesada:false, pagoMinimo:false, cuotas:false })) return; return topInvertir();
      case 'bancos':    return topBancos(u);
      case 'inflacion': return topInflacion();
      case 'hormiga':   return topHormiga();
      case 'reto':      return topReto();
      case 'escenario': return topEscenario();
      default:
        if (tryCalcular(text, u, pm, pmo)) return;
        return smartFallback(text, u, pm, pmo);
    }
  }

  /* ================= 23. ARRANQUE ================= */
  async function boot() {
    state.convo.forEach(m => renderRow(m.r, m.t));
    if (state.name || state.namedFlag) {
      return goGreeting();
    }
    // Si viene de curso en curso, ofrécele retomarlo
    if (state.curso && state.curso.active && !state.curso.done) {
      on('Continuar el curso', resumeCurso);
      return botTalk(['¿Retomamos el curso o hablamos de otra cosa?'], ['Continuar el curso', 'Preguntar otra cosa']);
    }
    goBeforeName();
  }

  /* ================= 24. EVENTOS ================= */
  $('sendBtn').addEventListener('click', () => { const t = input.value.trim(); if (t) handleUser(t); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const t = input.value.trim(); if (t) handleUser(t); } });

  $('resetBtn').addEventListener('click', () => {
    if (!window.confirm('¿Borrar la conversación? Se eliminarán el historial, el perfil y el progreso guardado.')) return;
    ['lukash-name', 'lukash-named', 'lukash-profile', 'lukash-convo', 'lukash-state'].forEach(k => store.del(k));
    state.name = ''; state.namedFlag = false; state.profile = {}; state.convo = []; state.used = new Set();
    state.pending = null; state.lastTopic = null; state.menuFactory = null;
    state.courseOffered = false; state.purposeShown = false;
    state.curso = { step: 0, active: false, done: false };
    chatArea.innerHTML = ''; sugBox.innerHTML = ''; clearMap();
    boot();
  });

  $('expandBtn').addEventListener('click', () => {
    $('expandIcon').classList.toggle('hidden');
    $('minimizeIcon').classList.toggle('hidden');
    document.querySelector('.app').classList.toggle('app--full');
  });

  $('closeBtn').addEventListener('click', () => {
    const app = document.querySelector('.app');
    app.classList.add('app--hidden');
    $('fab').classList.remove('hidden');
    $('fabExpandIcon').classList.remove('hidden');
    $('fabMinimizeIcon').classList.add('hidden');
  });
  $('fab').addEventListener('click', () => {
    const app = document.querySelector('.app');
    const isFull = app.classList.contains('app--full');
    const isHidden = app.classList.contains('app--hidden');
    
    if (isHidden) {
      // Desde modo oculto: mostrar app en modo normal
      app.classList.remove('app--hidden');
      $('fab').classList.add('hidden');
      $('fabExpandIcon').classList.remove('hidden');
      $('fabMinimizeIcon').classList.add('hidden');
    } else if (!isFull) {
      // Desde modo normal: ampliar a full screen
      app.classList.add('app--full');
      $('fabExpandIcon').classList.add('hidden');
      $('fabMinimizeIcon').classList.remove('hidden');
    } else {
      // Desde full screen: reducir a normal
      app.classList.remove('app--full');
      $('fabExpandIcon').classList.remove('hidden');
      $('fabMinimizeIcon').classList.add('hidden');
    }
  });

  // Modo "grande" standalone: al abrir lukash-chat.html?full=1 desde
  // GUIA PERSONALIZADA / CONSULTAR A LA IA se muestra el chat a pantalla
  // completa con un boton "volver" para regresar a la pantalla anterior.
  const urlParams = new URLSearchParams(window.location.search);
  const fullMode = urlParams.get('full') === '1';

  function goBack() {
    if (document.referrer) {
      window.location.href = document.referrer;
    } else {
      window.location.href = 'index.html';
    }
  }

  if (fullMode) {
    const app = document.querySelector('.app');
    app.classList.add('app--standalone');
    app.classList.remove('app--hidden');
    $('backBtn').classList.remove('hidden');
    $('expandBtn').classList.add('hidden');
    $('closeBtn').classList.add('hidden');
    $('fab').classList.add('hidden');
  }
  $('backBtn').addEventListener('click', goBack);

  boot();
})();
</script>
