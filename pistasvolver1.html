<script data-purpose="menu-functionality">
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
    const mobileMenuDrawer = document.getElementById('mobileMenuDrawer');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    const menuIcon = menuBtn.querySelector('.hamburger-icon');

    function openMenu() {
      mobileMenu.classList.remove('hidden');
      if(menuIcon) menuIcon.classList.add('hidden');
      setTimeout(() => {
        mobileMenuOverlay.classList.remove('opacity-0');
        mobileMenuDrawer.classList.remove('-translate-x-[150%]');
      }, 10);
    }

    function closeMenu() {
      closeMenuBtn.style.opacity = '0';
      mobileMenuOverlay.classList.add('opacity-0');
      mobileMenuDrawer.classList.add('-translate-x-[150%]');
      setTimeout(() => {
        mobileMenu.classList.add('hidden');
        closeMenuBtn.style.opacity = '1';
        if(menuIcon) menuIcon.classList.remove('hidden');
      }, 300);
    }

    menuBtn.addEventListener('click', openMenu);
    closeMenuBtn.addEventListener('click', closeMenu);
    mobileMenuOverlay.addEventListener('click', closeMenu);

    const desktopCategorias = document.getElementById('desktopCategorias');
    const desktopCategoriasBtn = document.getElementById('desktopCategoriasBtn');
    const desktopCategoriasMenu = document.getElementById('desktopCategoriasMenu');
    const desktopCategoriasArrow = document.getElementById('desktopCategoriasArrow');

    function toggleDesktopMenu(open) {
      desktopCategoriasMenu.classList.toggle('hidden', !open);
      desktopCategoriasArrow.classList.toggle('rotate-180', open);
    }

    desktopCategoriasBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = desktopCategoriasMenu.classList.contains('hidden');
      toggleDesktopMenu(isHidden);
    });
    desktopCategorias.addEventListener('mouseenter', () => toggleDesktopMenu(true));
    desktopCategorias.addEventListener('mouseleave', () => toggleDesktopMenu(false));
    document.addEventListener('click', (e) => {
      if (!desktopCategorias.contains(e.target)) toggleDesktopMenu(false);
    });

    const mobileCategoriasBtn = document.getElementById('mobileCategoriasBtn');
    const mobileCategoriasMenu = document.getElementById('mobileCategoriasMenu');
    const mobileCategoriasArrow = document.getElementById('mobileCategoriasArrow');

    mobileCategoriasBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = mobileCategoriasMenu.classList.contains('hidden');
      mobileCategoriasMenu.classList.toggle('hidden', !isHidden);
      mobileCategoriasArrow.classList.toggle('rotate-180', isHidden);
    });
</script>
<script data-purpose="theme-toggle">
  (function () {
    var key = 'lukash-theme';
    var root = document.documentElement;
    var apply = function (dark) {
      root.classList.toggle('dark', dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    };
    var toggles = document.querySelectorAll('.theme-toggle');
    var stored = null;
    try { stored = localStorage.getItem(key); } catch (e) {}
    var shouldDark = stored ? (stored === 'dark') : root.classList.contains('dark');
    apply(shouldDark);
    toggles.forEach(function (t) {
      t.addEventListener('click', function () { apply(!root.classList.contains('dark')); });
    });
  })();
</script>
<script data-purpose="secuencia-animacion">
  /* Animación secuencial lenta con efecto máquina de escribir:
     1) Se escribe TODO el texto del recuadro verde en un solo contenedor.
     2) Al terminar desaparece el cursor.
     3) Mostrar la tarjeta "Pero antes que nada toma nota de esta cifra...".
     4) Mostrar el número 100 con animación.
     5) Mostrar el botón VOLVER (verde). */
  (function () {
    // El texto se escribe en un único contenedor; la pregunta va en negrilla
    var segments = [
      { text: 'Ahora que sabes que invertir está al alcance, debes descubrir: ', bold: false },
      { text: '¿dónde puede invertir una persona su dinero?', bold: true },
      { text: ' Reúne las pistas y explora las diferentes opciones de inversión para convertirte en un experto financiero.', bold: false }
    ];
    var chars = [];
    var fullLength = 0;
    segments.forEach(function (seg) {
      seg.text.split('').forEach(function (ch) {
        chars.push({ ch: ch, bold: seg.bold });
      });
      fullLength += seg.text.length;
    });

    var typeEl = document.getElementById('typingFull');
    var cifraCard = document.getElementById('cifraCard');
    var cienBubble = document.getElementById('cienBubble');
    var volverBtn = document.querySelector('.volver-btn');

    var speed = 40; // ms por carácter: animación rápida

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function caret() { return '<span class="type-caret"></span>'; }

    // Construye el HTML con la pregunta escrita dentro de <strong>
    function renderHTML(pos) {
      var html = '';
      var inBold = false;
      for (var i = 0; i < pos && i < chars.length; i++) {
        var c = chars[i];
        if (c.bold && !inBold) { html += '<strong>'; inBold = true; }
        else if (!c.bold && inBold) { html += '</strong>'; inBold = false; }
        html += c.ch;
      }
      if (inBold) html += '</strong>';
      return html;
    }

    function typeInto(el) {
      return new Promise(function (resolve) {
        el.innerHTML = caret();
        var pos = 0;
        var timer = setInterval(function () {
          pos++;
          el.innerHTML = renderHTML(pos) + caret();
          if (pos >= fullLength) {
            clearInterval(timer);
            // Al terminar se deja el texto completo SIN el cursor de escritura
            el.innerHTML = renderHTML(fullLength);
            resolve();
          }
        }, speed);
      });
    }

    async function run() {
      if (!typeEl) return;
      await typeInto(typeEl);
      await sleep(450);
      cifraCard.classList.remove('hidden');
      cifraCard.classList.add('slide-in-left');
      await sleep(1300);
      cienBubble.classList.remove('hidden');
      cienBubble.classList.add('pop-in');
      await sleep(1300);
      volverBtn.classList.remove('hidden');
      volverBtn.classList.add('fade-in-up');
    }

    run();
  })();
</script>
