<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script data-purpose="supabase-config">
  /* ============================================================
     CONFIGURACIÓN SUPABASE (plan gratuito)
     1) supabase.com -> New project -> copiar "Project URL" + "anon public key".
     2) Authentication > Providers > Email -> desactivar "Confirm email".
     3) Ejecutar UNA vez el script de supabase.sql en el SQL Editor.
     4) Pegar URL y anon key en las 2 constantes de abajo.
     El sitio sigue funcionando offline: lee/escribe localStorage siempre
     y sincroniza con Supabase cuando hay sesión y conexión.
     ============================================================ */
  const SUPABASE_URL = 'https://roccgeelgkrgmpmrufwh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable__6DyGjeozpTJIFFtc0kv1Q_yeSLabpc';

  window.LUKASH = (() => {
    function client() {
      if (!window._lukashSb && typeof supabase !== 'undefined' && SUPABASE_URL.indexOf('PON_AQUI') === -1) {
        window._lukashSb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return window._lukashSb || null;
    }
    async function session() {
      const sb = client();
      if (!sb) return null;
      try {
        const { data } = await sb.auth.getSession();
        return (data && data.session) ? data.session : null;
      } catch (e) { return null; }
    }
    function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function safeRemove(k) { try { localStorage.removeItem(k); } catch (e) {} }
    function safeParse(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } }
    const COMPLETADAS_KEY = 'lukash_categorias_completadas';

    // Registro de cuenta nueva: crea la fila de perfil prellenada con el progreso local
    async function signUp(email, password) {
      const sb = client();
      if (!sb) throw new Error('Supabase aún no está configurado.');
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      const user = data && data.user;
      const hasIdentities = user && user.identities && user.identities.length > 0;
      const alreadyExists = user && !hasIdentities;
      if (alreadyExists) {
        throw new Error('Ya existe una cuenta con ese correo. Usá "Ya tengo cuenta".');
      }
      if (!data.session && user) {
        try {
          const login = await signIn(email, password);
          if (login && login.session) return login;
        } catch (e) {}
        safeSet('user_registered', 'true');
        safeSet('lukash_user_email', user.email || email);
        throw new Error('Te enviamos un correo de confirmación. Verificá tu casilla y luego usá "Ya tengo cuenta".');
      }
      if (user) {
        safeSet('user_registered', 'true');
        safeSet('lukash_user_email', user.email || email);
        await ensureProfile(user.id);
      }
      return data;
    }
    // Inicio de sesión de una cuenta existente
    async function signIn(email, password) {
      const sb = client();
      if (!sb) throw new Error('Supabase aún no está configurado.');
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error('Correo o contraseña incorrectos.');
      if (data && data.user) {
        safeSet('user_registered', 'true');
        safeSet('lukash_user_email', data.user.email || email);
        await syncExisting(data.user.id);
      }
      return data;
    }
    // Cierre de sesión: limpia la sesión y los datos personales locales (se conserva el tema)
    async function signOut() {
      const sb = client();
      if (sb) { try { await sb.auth.signOut(); } catch (e) {} }
      ['user_registered','lukash_user_name','lukash_user_email','lukash_user_age','lukash_user_city',
       'lukash_categoria_seleccionada', COMPLETADAS_KEY].forEach(safeRemove);
    }
    // Crea la fila en "perfiles" prellenándola con los datos y progreso locales
    async function ensureProfile(userId) {
      const sb = client();
      if (!sb || !userId) return null;
      try {
        const row = {
          id: userId,
          nombre: safeGet('lukash_user_name') || '',
          edad: safeGet('lukash_user_age') ? Number(safeGet('lukash_user_age')) : null,
          ciudad: safeGet('lukash_user_city') || '',
          completadas: safeParse(COMPLETADAS_KEY)
        };
        const { data, error } = await sb.from('perfiles').upsert(row, { onConflict: 'id' }).select().single();
        if (error) throw error;
        return data;
      } catch (e) { return null; }
    }
    // Cuando el usuario ya existía: la nube manda y se refleja en localStorage
    async function syncExisting(userId) {
      const sb = client();
      if (!sb || !userId) return null;
      try {
        const { data, error } = await sb.from('perfiles').select('*').eq('id', userId).maybeSingle();
        if (error) throw error;
        if (data) return mirrorProfile(data);
        return await ensureProfile(userId);
      } catch (e) { return null; }
    }
    // Carga el perfil actual desde la nube o lo crea a partir del progreso local
    async function loadProfile() {
      const s = await session();
      if (!s) return null;
      const sb = client();
      if (!sb) return null;
      try {
        const { data, error } = await sb.from('perfiles').select('*').eq('id', s.user.id).maybeSingle();
        if (error) throw error;
        safeSet('lukash_user_email', s.user.email || '');
        if (data) return mirrorProfile(data);
        return await ensureProfile(s.user.id);
      } catch (e) { return null; }
    }
    // Refleja la fila de la nube sobre localStorage
    function mirrorProfile(data) {
      safeSet('user_registered', 'true');
      if (data.nombre) safeSet('lukash_user_name', data.nombre); else safeRemove('lukash_user_name');
      if (data.edad) safeSet('lukash_user_age', String(data.edad)); else safeRemove('lukash_user_age');
      if (data.ciudad) safeSet('lukash_user_city', data.ciudad); else safeRemove('lukash_user_city');
      safeSet(COMPLETADAS_KEY, JSON.stringify(data.completadas || []));
      return data;
    }
    // Guarda los datos editados (nombre/apodo, edad, ciudad) en la nube
    async function saveProfile(fields) {
      const nombre = (fields.nombre !== undefined) ? String(fields.nombre) : (safeGet('lukash_user_name') || '');
      const ciudad = (fields.ciudad !== undefined) ? String(fields.ciudad) : (safeGet('lukash_user_city') || '');
      let edad = null;
      if (fields.edad !== undefined) {
        const v = String(fields.edad).trim();
        edad = (v === '') ? null : (Number(v) || null);
      } else if (safeGet('lukash_user_age')) {
        edad = Number(safeGet('lukash_user_age'));
      }
      safeSet('lukash_user_name', nombre);
      safeSet('lukash_user_city', ciudad);
      if (edad) safeSet('lukash_user_age', String(edad)); else safeRemove('lukash_user_age');
      const s = await session();
      if (!s) return null;
      const sb = client();
      if (!sb) return null;
      try {
        const { data, error } = await sb.from('perfiles').upsert({
          id: s.user.id, nombre: nombre, edad: edad, ciudad: ciudad,
          completadas: safeParse(COMPLETADAS_KEY)
        }, { onConflict: 'id' }).select().single();
        if (error) throw error;
        return data;
      } catch (e) { return null; }
    }
    // Agrega una categoría completada a la nube (sin duplicar)
    async function markCategory(cat) {
      const s = await session();
      if (!s || !cat) return;
      const sb = client();
      if (!sb) return;
      try {
        const { data, error } = await sb.from('perfiles').select('completadas').eq('id', s.user.id).maybeSingle();
        if (error || !data) return await ensureProfile(s.user.id);
        const arr = data.completadas || [];
        if (arr.indexOf(cat) === -1) {
          arr.push(cat);
          await sb.from('perfiles').update({ completadas: arr }).eq('id', s.user.id);
        }
      } catch (e) {}
    }
    // Vacía el perfil y el progreso en la nube (usado por "Limpiar mi progreso")
    async function resetProfile() {
      const s = await session();
      if (!s) return;
      const sb = client();
      if (!sb) return;
      try {
        await sb.from('perfiles').update({ nombre: '', edad: null, ciudad: '', completadas: [] }).eq('id', s.user.id);
      } catch (e) {}
    }
    return { client, session, signUp, signIn, signOut, loadProfile, saveProfile, markCategory, resetProfile };
  })();
</script>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const spinBtn = document.getElementById('spinButton');
            const wheel = document.getElementById('fortuneWheel');
            const starNeedle = document.getElementById('starNeedle');
            const wheelWrapper = document.getElementById('wheel-wrapper');
            const scenarioContainer = document.getElementById('scenario-container');
            const resetBtn = document.getElementById('reset-btn');
            
            let needleRotation = 0;
            let isSpinning = false;

            if(spinBtn) {
                spinBtn.addEventListener('click', () => {
                    if (isSpinning) return;
                    isSpinning = true;

                    // Button press effect
                    spinBtn.style.transform = 'translateY(8px)';
                    spinBtn.style.boxShadow = '0 0px 0 0 rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.4)';

                    // Rotación aleatoria SOLO de la púa (la rueda no se mueve)
                    const extraDegrees = Math.floor(Math.random() * 360);
                    const spins = 1800; // 5 vueltas completas de la púa
                    needleRotation += (spins + extraDegrees);

                    if(starNeedle) {
                        starNeedle.style.transform = `translateY(-25%) rotate(${needleRotation}deg)`;
                    }

                    // Determina el escenario según dónde cayó la púa (ángulo final de la aguja)
                    const landingSector = Math.floor(((needleRotation % 360) / 360) * SCENARIOS.length);
                    currentScenarioIndex = Math.max(0, Math.min(landingSector, SCENARIOS.length - 1));

                    // Phase 1: Wait for spin animation (3.2s)
                    setTimeout(() => {
                        // Phase 2: la ruleta se empequeñece (transición de 0.8s)
                        wheelWrapper.classList.add('state-scenario');
                        setTimeout(() => {
