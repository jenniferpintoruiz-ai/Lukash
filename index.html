<style data-purpose="background-styles">
    body {
      background: linear-gradient(180deg, #1A0B3B 0%, #B12E7B 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Diagonal Tape Decoration */
    .diagonal-tape {
      position: fixed;
      width: 200vw;
      height: 120px;
      transform: rotate(-10deg);
      top: 60%;
      left: -25%;
      z-index: 5;
      display: flex;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    
    .tape-content {
      display: flex;
      width: max-content;
      animation: scroll-tape 15s linear infinite;
    }

    @keyframes scroll-tape {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Fly-in UI Assembly Animations */
    .{
        transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.2s ease-out;
        opacity: 0;
    }
    
    .fly-in-menu { transform: translate(-50vw, -80vh) scale(0.2) rotate(0); }
    .fly-in-logo { transform: translate(0, -80vh) scale(0.2) rotate(0); }
    .fly-in-user { transform: translate(50vw, -80vh) scale(0.2) rotate(0); }
    .fly-in-nav-item { transform: translate(0, -80vh) scale(0.4); }
    
    .assembled .{
        transform: translate(0, 0) scale(1) rotate(0);
        opacity: 1;
    }

    .flash-overlay {
        position: fixed;
        inset: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        z-index: 90;
        transition: opacity 1.5s ease-out;
    }
    .flash-overlay.active {
        opacity: 0.85;
        transition: opacity 0.1s ease-in;
    }
  </style>
<style data-purpose="button-3d-effects">
    .btn-3d {
      box-shadow: 0 4px 0 #9d1c5b;
      transition: all 0.1s ease;
    }
    .btn-3d:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #9d1c5b;
    }
    
    .fab-shadow {
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* Particle explosion */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: explode 0.6s ease-out forwards;
    }
    @keyframes explode {
      0% {
        transform: scale(0) translate(0, 0);
        opacity: 1;
      }
      100% {
        transform: scale(1) translate(var(--tx), var(--ty));
        opacity: 0;
      }
    }

    /* Chat Window Animations */
    .chat-window {
      transform-origin: bottom right;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .chat-window.hidden-chat {
      transform: scale(0);
      opacity: 0;
      pointer-events: none;
    }
    .chat-window.active-chat {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .fab-btn {
      transition: all 0.3s ease;
    }
    .fab-btn.exploding {
      transform: scale(1.2);
      opacity: 0;
      pointer-events: none;
    }
    
    .chat-msg {
      animation: popIn 0.3s ease-out forwards;
      opacity: 0;
      transform: translateY(10px);
    }
    @keyframes popIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) scale(1); }
      8% { transform: translateX(-22px) translateY(-8px) rotate(-14deg) scale(1.12); }
      16% { transform: translateX(24px) translateY(6px) rotate(14deg) scale(1.15); }
      24% { transform: translateX(-30px) translateY(-10px) rotate(-18deg) scale(1.2); }
      32% { transform: translateX(34px) translateY(8px) rotate(18deg) scale(1.22); }
      40% { transform: translateX(-38px) translateY(-14px) rotate(-22deg) scale(1.28); }
      48% { transform: translateX(40px) translateY(10px) rotate(22deg) scale(1.3); }
      56% { transform: translateX(-42px) translateY(-18px) rotate(-26deg) scale(1.35); }
      64% { transform: translateX(38px) translateY(12px) rotate(24deg) scale(1.32); }
      72% { transform: translateX(-30px) translateY(-10px) rotate(-18deg) scale(1.24); }
      80% { transform: translateX(24px) translateY(8px) rotate(14deg) scale(1.16); }
      90% { transform: translateX(-16px) translateY(-6px) rotate(-10deg) scale(1.1); }
    }
    .animate-shake {
      animation: shake 0.8s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Screen shake triggered during catastrophe */
    @keyframes screen-shake {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-8px, 6px); }
      20% { transform: translate(9px, -7px); }
      30% { transform: translate(-10px, 5px); }
      40% { transform: translate(11px, -6px); }
      50% { transform: translate(-9px, 8px); }
      60% { transform: translate(8px, -5px); }
      70% { transform: translate(-7px, 6px); }
      80% { transform: translate(6px, -4px); }
      90% { transform: translate(-4px, 3px); }
    }
    .screen-shake-active {
      animation: screen-shake 0.9s ease-in-out;
    }

    #explosion-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 30;

      mobileMenu.classList.remove('hidden');
      if(menuIcon) menuIcon.classList.add('hidden');
      setTimeout(() => {
        mobileMenuOverlay.classList.remove('opacity-0');
        mobileMenuDrawer.classList.remove('-translate-x-[150%]');
      }, 10);
    }

    function closeMenu() {
      closeMenuBtn.style.opacity = '0';
      mobileMenuOverlay.classList.add('opacity-0');
      mobileMenuDrawer.classList.add('-translate-x-[150%]');
      setTimeout(() => {
        mobileMenu.classList.add('hidden');
        closeMenuBtn.style.opacity = '1';
        if(menuIcon) menuIcon.classList.remove('hidden');
      }, 300);
    }

    menuBtn.addEventListener('click', openMenu);
    closeMenuBtn.addEventListener('click', closeMenu);
    mobileMenuOverlay.addEventListener('click', closeMenu);

    // Desktop Categorias dropdown toggle
    const desktopCategorias = document.getElementById('desktopCategorias');
    const desktopCategoriasBtn = document.getElementById('desktopCategoriasBtn');
    const desktopCategoriasMenu = document.getElementById('desktopCategoriasMenu');
    const desktopCategoriasArrow = document.getElementById('desktopCategoriasArrow');

    function toggleDesktopMenu(open) {
      desktopCategoriasMenu.classList.toggle('hidden', !open);
      desktopCategoriasArrow.classList.toggle('rotate-180', open);
    }

    desktopCategoriasBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = desktopCategoriasMenu.classList.contains('hidden');
      toggleDesktopMenu(isHidden);
    });
    desktopCategorias.addEventListener('mouseenter', () => toggleDesktopMenu(true));
    desktopCategorias.addEventListener('mouseleave', () => toggleDesktopMenu(false));
    document.addEventListener('click', (e) => {
      if (!desktopCategorias.contains(e.target)) toggleDesktopMenu(false);
    });

    // Mobile Categorias dropdown toggle
    const mobileCategoriasBtn = document.getElementById('mobileCategoriasBtn');
    const mobileCategoriasMenu = document.getElementById('mobileCategoriasMenu');
    const mobileCategoriasArrow = document.getElementById('mobileCategoriasArrow');

    mobileCategoriasBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = mobileCategoriasMenu.classList.contains('hidden');
      mobileCategoriasMenu.classList.toggle('hidden', !isHidden);
      mobileCategoriasArrow.classList.toggle('rotate-180', isHidden);
    });

  </script>
<script data-purpose="chat-functionality">
  const fabButton = document.getElementById('fab-button');
  const chatWindow = document.getElementById('chat-window');
  const closeChat = document.getElementById('close-chat');
  const particleContainer = document.getElementById('particle-container');
  const chatForm = document.getElementById('chat-form');
  const chatMessages = document.getElementById('chat-messages');

  const brandColors = ['#EE4599', '#180F43', '#E7C11F', '#A7EB5D'];

  function createParticles(x, y) {
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      
      const size = Math.random() * 10 + 5;
      const color = brandColors[Math.floor(Math.random() * brandColors.length)];
      
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.backgroundColor = color;
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;

      const angle = Math.random() * Math.PI * 2;
      const velocity = 50 + Math.random() * 100;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity;

      particle.style.setProperty('--tx', `${tx}px`);
      particle.style.setProperty('--ty', `${ty}px`);

      particleContainer.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, 600);
    }
  }

  fabButton.addEventListener('click', (e) => {
    const rect = fabButton.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    fabButton.classList.add('exploding');
    createParticles(centerX, centerY);
    
    setTimeout(() => {
      chatWindow.classList.remove('hidden-chat');
      chatWindow.classList.add('active-chat');
    }, 200);
  });

  closeChat.addEventListener('click', () => {
    chatWindow.classList.remove('active-chat');
    chatWindow.classList.add('hidden-chat');
    
    setTimeout(() => {
      fabButton.classList.remove('exploding');
    }, 300);
  });

  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const input = chatForm.querySelector('input');
    const text = input.value.trim();
    if (!text) return;

    // Add user message
    const userMsg = document.createElement('div');
    userMsg.className = 'bg-lukash-pink text-white p-3 rounded-lg rounded-tr-none self-end max-w-[80%] shadow-sm chat-msg';
    userMsg.innerHTML = `<p class="text-sm font-roboto">${text}</p>`;
    chatMessages.appendChild(userMsg);
    
    input.value = '';
    chatMessages.scrollTop = chatMessages.scrollHeight;

    // Simulate response
    setTimeout(() => {
      const botMsg = document.createElement('div');
      botMsg.className = 'bg-lukash-bg-modal text-lukash-dark p-3 rounded-lg rounded-tl-none self-start max-w-[80%] shadow-sm chat-msg';
      botMsg.innerHTML = `<p class="text-sm font-roboto">Interesante... ¡Seguí contándome!</p>`;
      chatMessages.appendChild(botMsg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }, 1000);
  });
</script>
<script data-purpose="explosion-logic">
    const canvas = document.getElementById('explosion-canvas');
    const ctx = canvas.getContext('2d');
    const piggy = document.getElementById('central-piggy');
    const restoreBtn = document.getElementById('restore-btn');
    const mainHeader = document.getElementById('main-header');
    const flashOverlay = document.getElementById('flash-overlay');
    const uiFabContainer = document.getElementById('ui-fab-container');

    let particlesArray = [];
    let isAnimating = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class ExplosionParticle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type;
            this.size = type === 'bill' ? Math.random() * 35 + 18 : Math.random() * 22 + 10;
            
            // CATASTROPHIC explosion power
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 120 + 40;
            this.speedX = Math.cos(angle) * velocity;
            this.speedY = Math.sin(angle) * velocity - 45; // Stronger upward bias
            
            this.rotation = Math.random() * 360;
            this.rotationSpeed = Math.random() * 30 - 15;
            
            this.flip = 0;
            this.flipSpeed = Math.random() * 0.4 + 0.1;

            // Realistic gravity based on type
            if (this.type === 'bill') {
                this.gravity = 0.2; // Bills float and flutter down slowly
            } else {
                this.gravity = 0.8; // Coins and sparks fall faster
            }
            
            this.life = Math.random() * 120 + 260;
        }

        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.speedY += this.gravity;
            
            // Add air resistance
            this.speedX *= 0.98;
            
            this.rotation += this.rotationSpeed;
            this.flip += this.flipSpeed;
            
            if (this.type === 'bill') {
                // Add violent flutter effect to horizontal speed
                this.speedX += Math.sin(this.flip) * 4;
            }
            
            this.life--;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation * Math.PI / 180);
            
            if (this.type === 'bill') {
                // Scale vertically to simulate 3D flipping in 2D space
                ctx.scale(1, Math.sin(this.flip));
            }

            if (this.type === 'coin') {
                ctx.scale(Math.cos(this.flip), 1); // Simulate coin flipping
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#FFD700';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#DAA520';
                ctx.stroke();
            } else if (this.type === 'bill') {
                ctx.beginPath();
                ctx.rect(-this.size, -this.size / 2, this.size * 2, this.size);
                ctx.fillStyle = '#8AC346';
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#5B8C2A';
                ctx.stroke();
            } else if (this.type === 'spark') {
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                ctx.fillStyle = '#FFF';
                ctx.fill();
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#E7C11F';
            }
            
            ctx.restore();
        }
    }

    function createExplosion(x, y) {
        // Massive catastrophic wealth explosion
        for (let i = 0; i < 700; i++) {
            particlesArray.push(new ExplosionParticle(x, y, 'coin'));
        }
        for (let i = 0; i < 700; i++) {
            particlesArray.push(new ExplosionParticle(x, y, 'bill'));
        }
        for (let i = 0; i < 300; i++) {
            particlesArray.push(new ExplosionParticle(x, y, 'spark'));
        }
    }

    function animate() {
        if (!isAnimating) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
            particlesArray[i].draw();
            
            if (particlesArray[i].life <= 0 || particlesArray[i].y > canvas.height + 100) {
                particlesArray.splice(i, 1);
                i--;
            }
        }
        
        if (particlesArray.length > 0) {
            requestAnimationFrame(animate);
        } else {
            isAnimating = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            restoreBtn.classList.remove('hidden');
        }
    }

    // Custom Event Listener for UI Assembly
    document.addEventListener('onPiggyCatastrophe', () => {
        // Full screen flash + screen shake for max impact
        flashOverlay.classList.add('active');
        document.body.classList.add('screen-shake-active');
        setTimeout(() => {
            flashOverlay.classList.remove('active');
        }, 150);
        setTimeout(() => {
            document.body.classList.remove('screen-shake-active');
        }, 900);

        // UI Assembly
        if (mainHeader) {
            mainHeader.classList.remove('opacity-0', 'pointer-events-none');
            // Aplica el estado visible final sin animación de caída
            mainHeader.classList.add('assembled');
        }
        
        if (uiFabContainer) {
            uiFabContainer.classList.remove('opacity-0', 'pointer-events-none');
        }
    });

    piggy.addEventListener('click', () => {
        piggy.classList.remove('animate-float');
        piggy.classList.add('animate-shake');
        
        setTimeout(() => {
            const rect = piggy.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            piggy.style.opacity = '0';
            piggy.style.pointerEvents = 'none';
            
            particlesArray = [];
            createExplosion(x, y);
            isAnimating = true;
            animate();
            
            // Dispatch catastrophic event
            const event = new CustomEvent('onPiggyCatastrophe');
            document.dispatchEvent(event);
            
        }, 800); // Wait for intense shake animation
    });

    restoreBtn.addEventListener('click', () => {
        if (mainHeader) {
            mainHeader.classList.remove('assembled');
            setTimeout(() => {
                mainHeader.classList.add('opacity-0', 'pointer-events-none');
            }, 500);
        }
        
        if (uiFabContainer) {
            uiFabContainer.classList.add('opacity-0', 'pointer-events-none');
        }
        
        restoreBtn.classList.add('hidden');
        piggy.classList.remove('animate-shake');
        piggy.style.opacity = '0.8'; // Match original opacity
        piggy.style.pointerEvents = 'auto';
        
        // Small delay before restoring float to prevent jumping
        setTimeout(() => {
            piggy.classList.add('animate-float');
        }, 50);
    });
</script>
